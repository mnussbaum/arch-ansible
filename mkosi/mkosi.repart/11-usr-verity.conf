[Partition]
Type=usr-verity
Verity=hash
VerityMatchKey=usr
Label=%M_%A_verity
SplitName=%t.%U
Minimize=yes

# Floor this at the installed system's verity slot size (see
# mkosi.extra/usr/lib/repart.d/21-usr-a-verity.conf, SizeMinBytes=512M). The
# medium's own first boot runs THOSE definitions against THIS layout, and repart
# cannot grow a partition packed between two others — this one sits between
# verity_sig and usr with no free space on either side. With Minimize=yes alone
# it comes out ~86M, under their 512M floor, and the whole run fails with "Can't
# fit requested partitions into available free space", so root is never created
# and the medium lands in emergency mode. Measured: any floor above the existing
# size fails, 86M (its exact size) passes. Costs ~426M of medium size.
SizeMinBytes=512M
