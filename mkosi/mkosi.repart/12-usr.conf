[Partition]
Type=usr
Format=erofs
Compression=zstd
Verity=data
VerityMatchKey=usr
Label=%M_%A
SplitName=%t.%U
CopyFiles=/usr:/
# Minimize= costs real build time and it is worth knowing exactly how much
# before anyone "optimises" it again. Measured on this 10.7G /usr:
#
#   yes (=best)  disk-image phase 225s; medium 13.82G; split usr 11.32G
#   guess        225s -> 205s, i.e. NO structural change: it still pre-populates
#                AND formats the whole filesystem to size it, despite the man
#                page implying read-only filesystems need only one pass. Image
#                byte-identical. A no-op.
#   off + 12G    177s (the pre-population passes genuinely disappear, 2 -> 0),
#                but medium 14.50G and split usr 12.00G.
#
# Kept at yes: that last number is what systemd-sysupdate transfers on EVERY A/B
# update, so "off" trades +0.68G per update forever for ~48s per build — and the
# total build time did not even separate from run-to-run variance (the cached-tree
# copy alone swings 87-107s). Cheaper build-time wins with no size cost: mkosi.conf's
# SplitArtifacts (~42s, only needed when testing updates) and moving the mkosi
# cache off ext4, which has no reflinks.
Minimize=yes
