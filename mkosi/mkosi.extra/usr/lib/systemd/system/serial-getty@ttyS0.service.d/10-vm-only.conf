# console=ttyS0 is on every UKI profile so bin/vm gets a shell over QEMU's
# serial port, and systemd-getty-generator starts a getty on each kernel console.
# On hardware ttyS0 is an unbacked placeholder UART, so agetty fails with an I/O
# error and systemd restarts it every 10s. Only run it in a VM.
[Unit]
ConditionVirtualization=vm
