[Partition]
Type=swap
Format=swap
Encrypt=tpm2
# Same PCR 7 + initrd-only signed PCR 11 binding as root (50-root.conf), and
# moved onto the pcrlock policy after first boot the same way. So it is opened
# in the initrd too (its crypttab). pcrlock-enroll-luks also seals it to root's
# PCR 15 measurement after first boot, which repart can't: it creates root in
# this same run.
TPM2PCRs=7
FactoryReset=yes
# Hibernation needs room for the image and systemd refuses it when free swap
# can't cover active memory. tmpfiles.d/hibernate.conf shrinks the image to
# active memory, so 16G suffices. Grow toward 16G on real disks; the low weight
# leaves small test disks near the floor.
SizeMinBytes=4G
SizeMaxBytes=16G
Weight=500
