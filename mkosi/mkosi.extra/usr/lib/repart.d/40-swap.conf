[Partition]
Type=swap
Format=swap
Encrypt=tpm2
# Same PCR 7 + signed PCR 11 binding as root (50-root.conf), and moved onto the
# pcrlock policy after first boot the same way.
TPM2PCRs=7
FactoryReset=yes
# Hibernation needs room for the image (kernel targets ~2/5 of RAM) and systemd
# refuses it when free swap can't cover active memory. Grow toward 16G on real
# disks; the low weight leaves small test disks near the floor.
SizeMinBytes=4G
SizeMaxBytes=16G
Weight=500
