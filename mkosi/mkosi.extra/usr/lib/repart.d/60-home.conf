[Partition]
Type=home
Format=btrfs
Label=home
MountPoint=/home:"noatime,compress=zstd:1,discard=async,space_cache=v2"
FactoryReset=yes
SizeMinBytes=10G
# The user's data lives here, in homed's LUKS image (/home/<user>.home), so home
# needs most of the disk. Root's Weight=3000 gives it 3/4 of the free space on
# small disks, but its SizeMaxBytes=128G cap sends everything past that to home.
Weight=1000
