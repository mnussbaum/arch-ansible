[Partition]
Type=usr
Label=%M_%A
CopyBlocks=auto
# Fixed size, byte-identical to usr-b (32-usr-b.conf). The A/B pair MUST be
# interchangeable or rotation succeeds in one direction and fails in the other.
#
# Do NOT let CopyBlocks=auto determine the size. It sizes the partition to the
# source /usr exactly, which leaves zero headroom: the 2026-08-19 A/B test failed
# because the new /usr was 500 KiB larger than the slot the *previous* image had
# sized, and 68 MiB larger than usr-b's old 8G floor. Slot size must be chosen
# for the image's growth over the machine's life, not for today's build — /usr
# went from ~5G to 8.07G in about two months. 16G is ~2x today and costs 32G for
# A+B, ~3% of a 1T disk.
#
# A partition larger than its erofs is fine: dm-verity takes the data size from
# the verity metadata, not from the partition.
SizeMinBytes=16G
SizeMaxBytes=16G
