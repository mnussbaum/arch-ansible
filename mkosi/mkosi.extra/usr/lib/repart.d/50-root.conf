[Partition]
Type=root
Format=btrfs
Label=root
MountPoint=/:"noatime,compress=zstd:1,discard=async,space_cache=v2"
# TPM2 only; no bootstrap keyslot. The booted system authorizes adding further
# factors with the volume key the initrd leaves in root's keyring
# (luks-volume-key), which is how luks-enroll-pkcs11.service adds the YubiKey
# at first boot.
Encrypt=tpm2
# Bind the TPM2 keyslot to PCR 7 (Secure Boot state and enrolled certs) as well
# as the signed PCR 11 policy repart adds by default from mkosi's
# SignExpectedPcr= key. PCR 7 alone is brittle across firmware/Secure Boot
# changes; signed PCR 11 alone leaves the seal indifferent to Secure Boot being
# switched off. Together they are what AstrOS ships ("sealed against PCR11+7");
# ParticleOS sets no TPM2PCRs= and so gets PCR 11 only. repart.d gained
# TPM2PCRs= in systemd 259; this image runs 262.
#
# The signed PCR 11 policy is the UKI's "initrd" one, which only covers the
# enter-initrd phase (systemd-repart.service.d/policyref.conf in the initrd).
# The default one also covers the phases after switch-root, so a booted system
# running from a swapped-in encrypted root could unseal this one.
#
# The literal PCR 7 here only lasts until the end of first boot:
# pcrlock-enroll-luks.service then moves it onto a systemd-pcrlock policy for
# PCR 7, which can be re-predicted after a Secure Boot variable change. It has
# to start literal because no pcrlock policy exists yet in the initrd.
TPM2PCRs=7
FactoryReset=yes
Subvolumes=/var
MakeDirectories=/var/log /var/cache /var/tmp /var/log/journal
SizeMinBytes=4G
# Root holds /var/cache/arch-ansible: the on-device build's scratch, caches and
# its retained output versions (~18G each, 3 kept by default), which peaked past
# 22G and overflowed an evenly split 22G root. Weight it 3:1 over home so small
# disks (VMs, the 60G test disk) still have room to build, but cap it at 128G:
# the user's data lives in a homed LUKS image *on* the home partition, so an
# uncapped 3:1 split starved home on a real disk (107G home vs. 320G root on a
# 512G NVMe, too small to restore a 183G backup). Past the cap, repart hands the
# rest of the free space to home.
#
# Root and home are the only partitions without a fixed size (the ESP, usr and
# verity slots and swap all set SizeMaxBytes), so between them they absorb the
# whole remainder. Without that, each uncapped partition takes a Weight=1000
# share of free space: the ESP and usr-a-verity once got ~5.9G apiece on the 60G
# test disk.
Weight=3000
SizeMaxBytes=128G
