[Partition]
Type=usr-verity-sig
Label=_empty
# No NoAuto= here: the no-auto GPT attribute isn't defined for verity-sig
# partitions, so repart warns and ignores it. It IS kept on 31/32 (usr-b,
# usr-b-verity), which is what actually gates auto-activation of the B slot.
SizeMinBytes=4M
SizeMaxBytes=4M
