[General]

[DriverQuirks]
# Keep the kernel's netdev instead of deleting and recreating it each time iwd
# starts, so wlan0 keeps a stable ifindex across iwd restarts.
DefaultInterface=*

[Scan]
# Rescan soon after a failed connect instead of waiting out the default backoff,
# so a rejected BSS doesn't stall reconnection for tens of seconds.
InitialPeriodicScanInterval=3
