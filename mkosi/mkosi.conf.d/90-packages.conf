# Packages the roles used to install from their `package:` tasks, moved here
# so they land in mkosi's CACHED package phase instead of ~38 separate
# transactions inside the Ansible postinst (355s+ of an 884s build, each one
# re-firing the image's 31 alpm hooks).
#
# Grouped by the role that owned them, so provenance survives. The AUR group
# at the end installs from the local aur-repo, which mkosi.conf exposes via
# PackageDirectories=; bin/sync-aur builds and updates those packages before
# mkosi runs.
#
# kubectx sits with the AUR group: it depends on kubectl, which the AUR
# kubectl-bin provides and conflicts with. Listed together in ONE transaction
# pacman picks kubectl-bin as the provider, which is what the roles used to
# arrange by installing kubectl-bin first in a separate task.

[Content]
Packages=
    # archiso
    archiso
    udisks2
    # backup
    fuse2
    restic
    udisks2
    # bluetooth
    bluez
    bluez-tools
    bluez-utils
    # brightness
    brightnessctl
    upower
    # cli-tools
