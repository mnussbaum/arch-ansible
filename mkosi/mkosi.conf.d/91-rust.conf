# vim: ft=dosini
# The Parallel profile installs rustup instead, which conflicts with rust.
# Profiles come from --profile, so this matches before the profile is parsed.
# rust is also a builder package (mkosi.build's cargo install), so
# container/Containerfile installs this list too.
[Match]
Profiles=!parallel

[Content]
BuildPackages=rust
Packages=
    rust
    rust-src
