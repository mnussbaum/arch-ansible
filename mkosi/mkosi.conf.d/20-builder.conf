# vim: ft=dosini
# Everything a builder of this image needs: bin/build-image, bin/sync-aur,
# mkosi with ToolsTree=/ (mkosi.build and mkosi.finalize run with the builder's
# /usr), and container/dr-unlock. The image carries them so it can rebuild and
# update itself, and container/Containerfile installs this same list, so the
# disaster-recovery builder can't drift from it. Some are also needed at
# runtime and listed in mkosi.conf for that reason too.

[Content]
Packages=
    # makepkg, for bin/sync-aur.
    base-devel
    btrfs-progs
    ccid
    cpio
    cryptsetup
    curl
    # bin/sync-aur builds the image's AUR packages in a devtools clean chroot,
    # so the image can rebuild (and update) itself with a read-only /usr.
    devtools
    dosfstools
    erofs-utils
    git
    gnupg
    kmod
    mkosi
    mtools
    openssh
    openssl
    pass
    pcsclite
    pinentry
    python
    python-cryptography
    python-pefile
    python-pystache
    python-yaml
    rsync
    sccache
    sudo
    systemd
    systemd-ukify
    tpm2-tss
    zstd
