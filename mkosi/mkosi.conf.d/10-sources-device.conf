# vim: ft=dosini
# TRANSITIONAL: delete this whole file once builds only ever run in-image (at
# which point /usr is the only source and these can move back into mkosi.conf).
# In-image builder: password-store comes from its in-image location. The
# .chroot postinst's pacman sync DB has no system source on a device, so it
# comes from a persistent local cache that bin/update-system refreshes (sudo
# pacman -Sy) before building. Matches when ARCH_ANSIBLE_TARGET=device, set by
# bin/update-system.
[Match]
Environment=ARCH_ANSIBLE_TARGET=device

[Build]
BuildSources=/usr/share/password-store:password-store

[Content]
ExtraTrees=/usr/share/password-store:/usr/share/password-store
SkeletonTrees=${ARCH_ANSIBLE_CACHE}/arch-ansible/pacman-db/sync:/var/lib/pacman/sync
