# vim: ft=dosini
# Extends mkosi's default initrd. Ship the console keymap so the LUKS prompt and
# initrd emergency shell get CapsLock→Escape too; mkosi only does this for the
# standalone mkosi-initrd tool, not the image's default initrd.
#
# Also ship pcscd and the PIV PKCS#11 module, so the YubiKey (shared PIV key)
# can unlock root when the TPM can't; see extra/etc/systemd/system/pcscd.*.

[Content]
Packages=
    pcsclite
    ccid
    opensc
ExtraTrees=
    ../mkosi.extra/etc/vconsole.conf:/etc/vconsole.conf
    ../../ansible/roles/vconsole/files/us-custom.map:/usr/share/kbd/keymaps/i386/qwerty/us-custom.map
    extra:/
