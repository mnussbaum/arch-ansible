# vim: ft=dosini
# Extends mkosi's default initrd. Ship the console keymap so the LUKS prompt and
# initrd emergency shell get CapsLock→Escape too; mkosi only does this for the
# standalone mkosi-initrd tool, not the image's default initrd.
#
# Also ship pcscd and the PIV PKCS#11 module, so the YubiKey (shared PIV key)
# can unlock root when the TPM can't; see extra/etc/systemd/system/pcscd.*.

[Content]
Packages=
    pcsclite
    ccid
    opensc
ExtraTrees=
    ../mkosi.extra/etc/vconsole.conf:/etc/vconsole.conf
    ../../ansible/roles/vconsole/files/us-custom.map:/usr/share/kbd/keymaps/i386/qwerty/us-custom.map
    extra:/
# The firmware reads and hashes the whole UKI before boot, so drop files the
# initrd never uses that its packages' dependencies drag in.
RemoveFiles=
    # Introspection data, libmagic's database and non-UTF-8 charset converters.
    /usr/share/gir-1.0
    /usr/share/file
    /usr/lib/gconv
    # sqlite's command line tools; libsqlite3 stays.
    /usr/bin/sqlite3*
    /usr/bin/sqldiff
    /usr/bin/showdb
    /usr/bin/showjournal
    /usr/bin/showshm
    /usr/bin/showstat4
    /usr/bin/showwal
    /usr/bin/dbdump
    /usr/bin/dbhash
    /usr/bin/dbtotxt
    /usr/bin/index_usage
    # Developer and container tools.
    /usr/bin/captree
    /usr/bin/flex
    /usr/bin/flex++
    /usr/bin/pcre2test
    /usr/bin/localedef
    /usr/bin/systemd-nspawn
    /usr/bin/systemd-vmspawn

[Output]
# zstd decompresses as fast at 19 as at the default 3, and the initrd shrinks
# by about a quarter; only the build gets slower.
CompressLevel=19
