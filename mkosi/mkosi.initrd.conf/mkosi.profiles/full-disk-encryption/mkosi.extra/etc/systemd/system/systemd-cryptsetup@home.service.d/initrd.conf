# One PIN prompt at a time, and done before switch-root. Retries like root.
# Before swap because both unseal through /dev/tpm0, which allows one opener
# at a time; run together, the loser falls back to the YubiKey.
[Unit]
After=systemd-cryptsetup@root.service
Before=systemd-cryptsetup@swap.service
Before=initrd.target
StartLimitIntervalSec=0

[Service]
# Unseal in systemd-cryptsetup itself rather than libcryptsetup's token
# plugins, like swap (see its drop-in).
Environment=SYSTEMD_CRYPTSETUP_USE_TOKEN_MODULE=0
Restart=on-failure
RestartSec=2
