# Done before switch-root, where its TPM2 slot no longer unseals. And after
# root, whose volume key measurement into PCR 15 its slot is sealed to
# (/usr/bin/luks-root-pcr15).
[Unit]
After=systemd-cryptsetup@root.service
Before=initrd.target

[Service]
# Unseal in systemd-cryptsetup itself, as root does (its PCR 15 measurement
# rules out libcryptsetup's token plugins). Through the plugins swap missed
# the tpm2-device=/dev/tpm0 speedup and took several seconds longer.
Environment=SYSTEMD_CRYPTSETUP_USE_TOKEN_MODULE=0
