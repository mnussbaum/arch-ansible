# Seal new volumes to the UKI's "initrd" PCR 11 signature (ukify
# --sign-initrd-pcrs), which only covers enter-initrd: the default signature
# also covers the leave-initrd/sysinit/ready phases, so a booted system running
# from a swapped-in root could unseal them. repart.d has no setting for this.
[Service]
ExecStart=
ExecStart=systemd-repart --dry-run=no --tpm2-public-key-policyref=initrd
