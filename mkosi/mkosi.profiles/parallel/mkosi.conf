# vim: ft=dosini
# Parallel Systems packages (bin/build-image --organization parallel). AUR
# packages come from the local aur-repo like 90-packages.conf's.

[Content]
Packages=
    # Toggled from waybar (roles/organizations/tasks/parallel).
    tailscale
    # AUR. Activated at first login (roles/organizations/tasks/parallel).
    vanta-agent
    # monorail, from its ci/install_ubuntu_deps_{root,user}.sh. rustup reads
    # monorail's rust-toolchain.toml, and replaces 91-rust.conf's rust.
    rustup
    bubblewrap
    cargo-binutils
    cargo-deb
    cargo-nextest
    cargo-udeps
    diesel-cli
    git-lfs
    graphviz
    llvm
    musl
    taplo-cli
    xorg-server-xvfb
