[Partition]
Type=home
Format=btrfs
Label=home
MountPoint=/home:"noatime,compress=zstd:1,discard=async,space_cache=v2"
# Replaces the base 60-home.conf. Sealed like root (50-root.conf);
# luks-enroll-pkcs11 adds the YubiKey. homed keeps homes as plain subvolumes on
# it (bin/_credstore_common.sh).
Encrypt=tpm2
TPM2PCRs=7
FactoryReset=yes
SizeMinBytes=10G
Weight=1000
