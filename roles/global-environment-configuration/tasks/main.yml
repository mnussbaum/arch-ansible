# vim:ft=yaml.ansible:
---
- name: Install /etc/environment
  copy:
    src: etc_environment
    dest: /etc/environment

- name: Install shell profile files
  copy:
    dest: "/etc/profile.d/{{ item | basename }}"
    src: "{{ item }}"
    mode: "u=rwx,g=rx,o=rx"
  with_fileglob:
    - profile.d/*

- name: Install global ZSH configs sourcing /etc/profile
  copy:
    dest: /etc/zsh/zprofile
    src: source_etc_profile

# /etc/profile.d is only sourced by login shells, not the systemd --user
# manager, so user services (e.g. waybar's custom modules) don't get
# /usr/lib/arch-ansible/bin on PATH. environment.d is read by the user manager
# and propagated to the services it spawns.
- name: Create environment.d dir
  file:
    path: /usr/lib/environment.d
    state: directory

- name: Install systemd user environment config
  copy:
    dest: "/usr/lib/environment.d/{{ item | basename }}"
    src: "{{ item }}"
  with_fileglob:
    - environment.d/*
