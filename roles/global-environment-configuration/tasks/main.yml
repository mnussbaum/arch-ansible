# vim:ft=yaml.ansible:
---
- name: Install /etc/environment
  copy:
    src: etc_environment
    dest: /etc/environment

- name: Install /etc/locale.conf
  copy:
    src: etc_locale.conf
    dest: /etc/locale.conf

- name: Install shell profile files
  copy:
    dest: "/etc/profile.d/{{ item | basename }}"
    src: "{{ item }}"
    mode: "u=rwx,g=rx,o=rx"
  with_fileglob:
    - profile.d/*

- name: Install global ZSH configs sourcing /etc/profile
  copy:
    dest: "{{ item }}"
    src: source_etc_profile
  with_items:
    - /etc/zsh/zprofile
    - /etc/zsh/zshrc
