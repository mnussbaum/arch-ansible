# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - tad-bin
      - direnv
      - python312
      - pre-commit
      - scie-pants-bin
      - slack-desktop
      - cloudflare-warp-bin
      - pqrs-bin

- name: Install .netrc
  template:
    src: eeek-netrc
    dest: "{{ user_home_dir }}/.netrc"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0600"

- name: Make AWS config dir
  file:
    dest: "{{ user_home_dir }}/.aws"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"

- name: Install AWS config
  copy:
    content: "{{ lookup('pipe', 'pass show eq/aws.conf') }}"
    dest: "{{ user_home_dir }}/.aws/config"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"

- name: Install equilibrium SSH private key
  copy:
    content: "{{ lookup('pipe', 'pass show eq/ssh-key') }}"
    dest: "{{ user_home_dir }}/.ssh/id_rsa_equilibrium"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0600"
  no_log: true
