# vim:ft=yaml.ansible:
---
- name: Create config dirs
  file:
    path: "/etc/xdg/{{ item }}"
    state: directory
  with_items:
    - qt5ct
    - qt5ct/colors
  tags: [base16]

# Provides desktop styling info to Qt5 apps
- name: Install packages
  package:
    state: present
    name:
      - qt5ct
      - qt5-wayland
      - qt6-wayland

- name: Generate base16 configs
  base16_builder:
    scheme: "{{ base16_scheme }}"
    scheme_family: "{{ base16_scheme_family }}"
    template: qt5ct
    schemes_source: "{{ base16['schemes_source'] }}"
    templates_source: "{{ base16['templates_source'] }}"
  register: base16_qt5ct
  tags: [base16]

- name: Install qt5ct config
  copy:
    content: "{{ base16_qt5ct['schemes'][base16_scheme]['qt5ct']['qt5ct_appearance_conf']['base16-' + base16_scheme + '.conf'] }}"
    dest: /etc/xdg/qt5ct/qt5ct.conf
  tags: [base16]

- name: Install qt5ct colors
  copy:
    content: "{{ base16_qt5ct['schemes'][base16_scheme]['qt5ct']['colors']['base16-' + base16_scheme + '.conf'] }}"
    dest: "/etc/xdg/qt5ct/colors/base16-{{ base16_scheme }}.conf"
  tags: [base16]
