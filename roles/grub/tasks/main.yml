# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - efibootmgr
      - grub
      - intel-ucode
      - os-prober

- name: Run os-prober to find other OS
  command: os-prober
  changed_when: false
  notify:
    - Regenerate grub.cfg

- name: Configure grub
  notify:
    - Regenerate grub.cfg
  template:
    src: grub.j2
    dest: /etc/default/grub

- name: Install grub
  when: bootstrap is defined and bootstrap == "true"
  notify:
    - Regenerate grub.cfg
  command: >
    grub-install --target=x86_64-efi
                 --efi-directory=/boot/efi
                 --bootloader-id=arch_grub
                 --removable
