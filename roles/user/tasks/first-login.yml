# vim:ft=yaml.ansible:
---
- name: Copy arch-ansible repo into home
  synchronize:
    src: /usr/local/share/arch-ansible/
    dest: "{{ ansible_env.HOME }}/Projects/arch-ansible/"
    owner: false
    group: false

- name: Inspect homed record for an existing PKCS#11 enrollment
  ansible.builtin.command: "homectl inspect {{ user.name }} --json=short"
  register: homed_record
  changed_when: false

- name: Discover a card-agnostic PKCS#11 URI for the YubiKey
  ansible.builtin.shell: |
    set -o pipefail
    p11tool --list-all-certs 'pkcs11:' 2>/dev/null \
      | sed -n 's/.*URL: //p' \
      | grep 'type=cert' \
      | grep -v 'p11-kit-trust' \
      | head -1 \
      | sed -E 's/;serial=[^;]*//; s/;token=[^;]*//'
  register: homed_pkcs11_uri
  changed_when: false
  failed_when: homed_pkcs11_uri.stdout | length == 0
  when: "'pkcs11TokenUri' not in homed_record.stdout"

- name: Enroll YubiKey (PKCS#11) as a home unlock factor
  ansible.builtin.command: "homectl update {{ user.name }} --pkcs11-token-uri={{ homed_pkcs11_uri.stdout }}"
  when: "'pkcs11TokenUri' not in homed_record.stdout"
