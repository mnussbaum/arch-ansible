# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - xdg-user-dirs

- name: Create wheel group
  group: name=wheel state=present

- name: Create skel .zshrc to suppress zsh-newuser-install
  copy:
    content: ""
    dest: /etc/skel/.zshrc
    force: false

- name: Create skel Projects dir
  file:
    path: /etc/skel/Projects
    state: directory

- name: Create skel .local/share dir
  file:
    path: /etc/skel/.local/share
    state: directory

- name: Symlink password-store into skel .local/share
  file:
    path: /etc/skel/.local/share/password-store
    src: /usr/share/password-store
    state: link
    force: true

- name: Symlink password-store into skel .password-store
  file:
    path: /etc/skel/.password-store
    src: /usr/share/password-store
    state: link
    force: true
