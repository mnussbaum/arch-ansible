# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - xdg-user-dirs

- name: Install systemd user preset
  copy:
    src: 80-user.preset
    dest: /usr/lib/systemd/user-preset/80-user.preset

- name: Create wheel group
  group: name=wheel state=present

- name: Configure sudoers
  copy:
    src: "ansible_sudoers"
    dest: /etc/sudoers.d/ansible
    validate: "/usr/bin/visudo -cf %s"

- name: Create individual user group
  group:
    name: "{{ user.group }}"
    state: present

- name: Create skel Projects dir
  file:
    path: /etc/skel/Projects
    state: directory

- name: Symlink repo into skel Projects
  file:
    path: /etc/skel/Projects/arch-ansible
    src: /usr/local/share/arch-ansible
    state: link
    force: true
    follow: false

- name: Create skel .local/share dir
  file:
    path: /etc/skel/.local/share
    state: directory

- name: Symlink password-store into skel .local/share
  file:
    path: /etc/skel/.local/share/password-store
    src: /usr/local/share/password-store
    state: link
    force: true

- name: Symlink password-store into skel .password-store
  file:
    path: /etc/skel/.password-store
    src: /usr/local/share/password-store
    state: link
    force: true

- name: Create user
  user:
    name: "{{ user.name }}"
    group: "{{ user.group }}"
    groups:
      - "{{ user.group }}"
      - input
      - pcscd
      - wheel
    password: "{{ user.password | password_hash('sha512') }}"
    shell: "{{ user.shell }}"
    update_password: on_create
    append: true
