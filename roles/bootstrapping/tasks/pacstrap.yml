# vim:ft=yaml.ansible:
---
- name: Install pacman mirrorlist
  copy:
    src: pacman_bootstrap_mirrorlist
    dest: /etc/pacman.d/mirrorlist

- name: Create pacman DB directory
  file:
    path: /var/lib/pacman/sync
    state: directory

- name: Install pacman DBs
  copy:
    src: ../pacman_dbs/{{ item }}
    dest: /var/lib/pacman/sync/{{ item }}
  loop:
    - core.db
    - extra.db

- name: Add pkg-cache as pacman CacheDir
  lineinfile:
    path: /etc/pacman.conf
    insertafter: '^\[options\]'
    line: 'CacheDir = /root/pkg-cache/'
  become: true

- name: Expand live environment cowspace for package downloads
  command: mount -o remount,size=4G /run/archiso/cowspace
  become: true

- name: Pacstrap
  command: "pacstrap -c {{ partitions['root'].mount_point }} {{ bootstrap_packages | join(' ') }}"
  become: true

- name: Generate fstab contents with mounts
  command: "genfstab -U -p {{ partitions['root'].mount_point }}"
  register: genfstab_result

- name: Write fstab file in chroot
  copy:
    content: "{{ genfstab_result.stdout }}"
    dest: "{{ partitions['root'].mount_point }}/etc/fstab"
  become: true

- name: Create password-store parent directory on provisioned machine
  file:
    path: "{{ partitions['root'].mount_point }}/home/{{ user.name }}/.local/share"
    state: directory
    mode: "0755"
  become: true

- name: Copy password-store from install media to provisioned machine
  synchronize:
    src: /root/password-store/
    dest: "{{ partitions['root'].mount_point }}/home/{{ user.name }}/.local/share/password-store"
    perms: false

- name: Configure bootstrapping facts in the chroot
  command: |
    systemd-firstboot --root {{ partitions['root'].mount_point }}
    --copy-locale
    --copy-timezone
    --hostname {{ new_hostname }}
