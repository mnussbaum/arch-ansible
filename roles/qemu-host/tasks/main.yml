---
- name: Install packages
  package:
    state: present
    name:
      - qemu-desktop
      - edk2-ovmf

- name: Enable kvm CPU pass-through
  copy:
    content: "options kvm_intel nested=1"
    dest: "/etc/modprobe.d/kvm_intel.conf"

- name: Enable virtio module
  copy:
    content: "virtio"
    dest: "/etc/modules-load.d/virtio.conf"

- name: Enable vhost_vsock module
  copy:
    content: "vhost_vsock"
    dest: "/etc/modules-load.d/vhost_vsock.conf"

- name: Create arch-images directory
  file:
    path: "/home/{{ user.name }}/.local/share/arch-images"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0750"

- name: Check nodatacow attribute on arch-images directory
  command: lsattr -d "/home/{{ user.name }}/.local/share/arch-images"
  register: arch_images_attrs
  changed_when: false

- name: Disable CoW on arch-images directory
  command: chattr +C "/home/{{ user.name }}/.local/share/arch-images"
  when: "'C' not in arch_images_attrs.stdout.split()[0]"
