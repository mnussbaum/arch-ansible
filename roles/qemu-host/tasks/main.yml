---
- name: Install packages
  package:
    state: present
    name:
      - qemu-desktop
      - edk2-ovmf
      - sdl2

- name: Enable kvm CPU pass-through
  copy:
    content: "options kvm_intel nested=1"
    dest: "/etc/modprobe.d/kvm_intel.conf"

- name: Enable virtio module
  copy:
    content: "virtio"
    dest: "/etc/modules-load.d/virtio.conf"

- name: Enable vhost_vsock module
  copy:
    content: "vhost_vsock"
    dest: "/etc/modules-load.d/vhost_vsock.conf"
