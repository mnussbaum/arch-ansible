# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - wofi
      - wofipassmenu

- name: Install wofi-toggle wrapper script
  copy:
    src: wofi-toggle
    dest: /usr/lib/arch-ansible/bin/wofi-toggle
    mode: a+x

- name: Create wofi config dir
  file:
    path: /etc/xdg/wofi
    state: directory
  tags: [base16]

- name: Generate wofi base16 configs
  base16_builder:
    scheme: "{{ base16_scheme }}"
    scheme_family: "{{ base16_scheme_family }}"
    template: wofi
    schemes_source: "{{ base16['schemes_source'] }}"
    templates_source: "{{ base16['templates_source'] }}"
  register: base16_wofi
  tags: [base16]

- name: Create wofi style.css
  copy:
    dest: /etc/xdg/wofi/style.css
    content: "{{ base16_wofi['schemes'][base16_scheme]['wofi']['themes']['base16-' + base16_scheme + '.css'] }}"
  tags: [base16]
