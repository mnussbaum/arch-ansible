# vim:ft=yaml.ansible:
---
# wezterm stable (20240203) crashes on wayland 1.23+ (wl_shm opcode mismatch);
# revert to wezterm once a newer stable is packaged in Arch extra
- name: Install
  package:
    name: "{{ item }}"
    state: present
  loop:
    - wezterm-git
    - ghostty

- name: Create config dir
  file:
    path: /etc/skel/.config/wezterm
    state: directory

- name: Install color scheme file
  template:
    src: wezterm_base16_colorscheme.yml.j2
    dest: "/etc/skel/.config/wezterm/base16-{{ base16_scheme }}.yml"
  tags: [base16]

- name: Install config
  template:
    src: wezterm.lua.j2
    dest: /etc/skel/.config/wezterm/wezterm.lua
  tags: [base16]
