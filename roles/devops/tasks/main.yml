# vim:ft=yaml.ansible:
---
- name: Enable loop kernel module
  copy:
    content: loop
    dest: /etc/modules-load.d/loop.conf

- name: Install packages
  become: yes
  package:
    state: present
    name:
      - docker
      - docker-buildx
      - docker-compose
      - amazon-ecr-credential-helper
      - kubectl-bin
      - rancher-k3d-bin
      - kubectx
      - helm
      - stern
      - terraform
      - redis

- name: Add user to docker group
  user:
    name: "{{ user.name }}"
    groups: docker
    append: true

- name: Create docker daemon config dir
  file:
    path: /etc/docker
    state: directory

- name: Enable overlay2 driver
  copy:
    src: docker-daemon.json
    dest: /etc/docker/daemon.json

- name: Install systemd preset
  copy:
    src: 80-devops.preset
    dest: /usr/lib/systemd/system-preset/80-devops.preset

- name: Enable docker service socket activation
  systemd:
    enabled: true
    name: docker.socket

- name: Create docker client config dir
  file:
    path: /etc/xdg/docker
    state: directory

- name: Install docker client config
  copy:
    src: docker-user-config.json
    dest: /etc/xdg/docker/config.json
