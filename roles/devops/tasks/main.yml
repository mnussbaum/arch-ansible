# vim:ft=yaml.ansible:
---
- name: Enable loop kernel module
  copy:
    content: loop
    dest: /usr/lib/modules-load.d/loop.conf

# kubectl-bin provides/conflicts the official `kubectl`, and `kubectx` depends
# on `kubectl`. Installed together in one transaction, the resolver pulls the
# official `kubectl` to satisfy kubectx and it conflicts with kubectl-bin.
# Install kubectl-bin first so it already satisfies kubectx's dependency.
- name: Install kubectl
  become: true
  package:
    state: present
    name: kubectl-bin

- name: Install packages
  become: true
  package:
    state: present
    name:
      - docker
      - docker-buildx
      - docker-compose
      - amazon-ecr-credential-helper
      - kubectx
      - helm
      - stern
      - terraform

- name: Create docker daemon config dir
  file:
    path: /etc/docker
    state: directory

- name: Enable overlay2 driver
  copy:
    src: docker-daemon.json
    dest: /etc/docker/daemon.json

- name: Install systemd preset
  copy:
    src: 80-devops.preset
    dest: /usr/lib/systemd/system-preset/80-devops.preset

- name: Create docker client config dir
  file:
    path: /etc/xdg/docker
    state: directory

- name: Install docker client config
  copy:
    src: docker-user-config.json
    dest: /etc/xdg/docker/config.json
