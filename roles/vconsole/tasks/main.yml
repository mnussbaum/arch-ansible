# vim:ft=yaml.ansible:
---
- name: Create keymap config dir
  file:
    path: "{{ vconsole_install_root }}/usr/share/kbd/keymaps/i386/qwerty"
    state: directory

- name: Install custom keymap with caps lock mapped to escape for the console's sake
  archive:
    path: files/us-custom.map
    dest: "{{ vconsole_install_root }}/usr/share/kbd/keymaps/i386/qwerty/us-custom.map.gz"
    format: gz
    mode: "u=rw,g=r,o=r"

- name: Configure console font
  copy:
    src: vconsole.conf
    dest: "{{ vconsole_install_root }}/etc/vconsole.conf"
