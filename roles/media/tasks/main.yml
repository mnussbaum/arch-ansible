# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    name:
      - alsa-utils
      - libcamera
      - libcamera-ipa
      - pipewire
      - pipewire-alsa
      - pipewire-docs
      - pipewire-pulse
      - pipewire-libcamera
      - sof-firmware
      - pwvucontrol
      - gstreamer
      - gst-plugin-va
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugin-pipewire
      - gst-libav
      - gst-plugin-libcamera
      - playerctl
      - rtkit
      - wireplumber
      - lollypop
      - mpv
      - xdg-desktop-portal
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - calibre-bin
      - intel-media-driver
    state: present

- name: Create XDG portal config dir
  file:
    path: /etc/xdg-desktop-portal
    state: directory

- name: Install XDG portal config file
  copy:
    src: sway-portals.conf
    dest: /etc/xdg-desktop-portal/sway-portals.conf

- name: Create wireplumber config dirs
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/wireplumber
    - /etc/wireplumber/wireplumber.conf.d

- name: Create wireplumber config to enable camera
  copy:
    src: wireplumber-99-libcamera.lua
    dest: /etc/wireplumber/99-libcamera.lua

- name: Create wireplumber config to fix bluetooth mic pops and enable high quality codecs
  copy:
    src: wireplumber-bluez-config.conf
    dest: /etc/wireplumber/wireplumber.conf.d/51-bluez-config.conf

- name: Install IPu6 ov01a10 front-facing camera config file
  copy:
    src: ov01a10.yaml
    dest: /usr/share/libcamera/ipa/simple/ov01a10.yaml

- name: Install IPu6 ov01a10 udev config file to fix digital gain
  copy:
    src: 99-ov01a10-digital-gain.rules
    dest: /usr/lib/udev/rules.d/99-ov01a10-digital-gain.rules

- name: Install systemd-sleep hook to fix IPu6 camera after suspend/resume
  copy:
    src: ipu6-suspend.sh
    dest: /usr/lib/systemd/system-sleep/ipu6-suspend.sh
    mode: a+x

- name: Install headphone profile toggle script
  copy:
    src: toggle-headphone-profile
    dest: /usr/lib/arch-ansible/bin/toggle-headphone-profile
    mode: a+x

- name: Create mpv config dir
  file:
    path: /etc/xdg/mpv
    state: directory

- name: Create mpv config
  copy:
    src: mpv.conf
    dest: /etc/xdg/mpv/mpv.conf

- name: Install systemd user preset
  copy:
    src: 80-media.preset
    dest: /usr/lib/systemd/user-preset/80-media.preset
