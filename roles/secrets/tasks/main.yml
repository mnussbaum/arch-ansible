# vim:ft=yaml.ansible:
---
- name: Secrets | Install packages
  become: true
  package:
    state: present
    name:
      - pass
      - browserpass
      - browserpass-firefox

- name: Clone password-store
  git:
    repo: git@gitlab.com:mnussbaum/password-store.git
    version: master
    dest: "{{ user_data_dir }}/password-store"
    accept_hostkey: yes
    update: false

# This is just so that I don't need to manually configure browserpass to use
# the XDG_DATA_HOME password-store
- file:
    src: "{{ user_data_dir }}/password-store"
    dest: "/home/{{ user.name }}/.password-store"
    state: link

- name: Secrets | Install pass-systemd-cred-server
  become: true
  package:
    state: present
    name: pass-systemd-cred-server

- name: Secrets | Install pass credential template socket unit
  copy:
    src: pass-credential@.socket
    dest: "{{ user_config_dir }}/systemd/user/pass-credential@.socket"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"

- name: Secrets | Install pass credential template service unit
  copy:
    src: pass-credential@.service
    dest: "{{ user_config_dir }}/systemd/user/pass-credential@.service"
    owner: "{{ user.name }}"
    group: "{{ user.group }}"

- name: Secrets | Reload user systemd daemon to register pass-credential templates
  become: true
  become_user: "{{ user.name }}"
  systemd:
    daemon_reload: true
    scope: user
