# vim:ft=yaml.ansible:
---
- name: Back up real sudo for nspawn passthrough
  copy:
    src: /usr/bin/sudo
    dest: /usr/bin/sudo.real
    remote_src: true
    mode: preserve

- name: Install sudo passthrough (already root in nspawn)
  copy:
    src: sudo-nspawn-passthrough
    dest: /usr/bin/sudo
    mode: '0755'

- name: Use in-container sccache server for nspawn builds
  lineinfile:
    path: /etc/makepkg.conf
    line: 'export SCCACHE_SERVER_PORT=14226'

- name: Set makepkg MAKEFLAGS for parallel builds
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?MAKEFLAGS='
    line: 'MAKEFLAGS="-j{{ ansible_facts["processor_vcpus"] + 1 }}"'

- name: Set makepkg EXTRACTFLAGS to skip ownership restoration when building as root
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?EXTRACTFLAGS='
    line: "EXTRACTFLAGS=(\"--no-same-owner\" \"-xf\")"

# zstd, not lzop: lzop is an *external* libarchive filter, and repo-add inspects a
# package with a quick bsdtar read (-tqf, stop at the first member .PKGINFO). That
# early-closes the pipe to lzop, which dies with a broken pipe and makes bsdtar
# reject the package ("is not a package file") — so a local repo of lzop packages
# could not be indexed at all. zstd decompresses inside libarchive (no
# external process, no broken pipe) and is the Arch default.
- name: Set makepkg package extension
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?PKGEXT='
    line: "PKGEXT='.pkg.tar.zst'"

- name: Set makepkg source extension
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?SRCEXT='
    line: "SRCEXT='.src.tar.gz'"

# Route every AUR package makepkg builds into a persistent, cached local repo
# dir instead of makepkg's default (the ephemeral build tree under BUILDDIR).
# This is the directory mkosi installs the AUR packages from
# (PackageDirectories= in mkosi.conf), so yay's only job is (re)populating it on
# an online build. The dir round-trips across builds like
# the yay clone cache (SkeletonTree seed + BuildSource live-mount + finalize
# write-back); makepkg.conf itself is dropped from the shipped image.
- name: Ensure the local AUR repo cache dir exists
  file:
    path: /var/cache/aur-repo
    state: directory

- name: Set makepkg PKGDEST to the local AUR repo cache dir
  lineinfile:
    path: /etc/makepkg.conf
    regexp: '^#?PKGDEST='
    line: "PKGDEST=/var/cache/aur-repo"

# Pin yay's clone/build dir to /var/cache/yay. yay defaults buildDir to
# $HOME/.cache/yay and the postinst runs it as root (HOME=/root), so without this
# it builds into /root/.cache/yay — but the SkeletonTree seed, the postinst delta-
# seed (mkosi.postinst.chroot), and mkosi.finalize's write-back all target
# /var/cache/yay. Pinning makes yay's actual build dir match that plumbing so the
# AUR git clones + downloaded sources round-trip across builds (fast/offline
# rebuilds) instead of yay re-cloning everything every build. Written where the
# root-run yay reads it ($HOME/.config/yay/config.json); a partial config leaves
# every other yay default untouched.
#
# gpgflags routes yay's PGP key import over plain hkp. yay imports every missing
# validpgpkeys entry before building and aborts the install if that fails — v13
# does it unconditionally (its pgpfetch setting is parsed but never read). An Arch
# update broke dirmngr's hkps transport to every keyserver while plain hkp kept
# working, which failed the build on aws-cli-bin. yay prepends gpgflags to all its
# gpg calls, --recv-keys included. Plaintext is fine here: makepkg only accepts a
# signature from a key whose full fingerprint is pinned in validpgpkeys, so a
# tampered response can't substitute a key. Online builds only — the postinst's
# `yay -Sua` is skipped under --caching force.
- name: Ensure yay's config dir exists
  file:
    path: "{{ ansible_env.HOME }}/.config/yay"
    state: directory
    mode: '0755'

- name: Configure yay (cached build dir, keyserver over hkp)
  copy:
    content: |
      {"buildDir": "/var/cache/yay", "gpgflags": "--keyserver hkp://keyserver.ubuntu.com:80"}
    dest: "{{ ansible_env.HOME }}/.config/yay/config.json"
    mode: '0644'

# --caching force: make AUR builds cache/offline only, the makepkg analogue of
# the pacman.conf XferCommand. makepkg sources makepkg.conf top-to-bottom, so a
# trailing block wins over the defaults; the file is dropped from the final
# image (mkosi.finalize.factory-seed DROPLIST), so this can never ship. DLAGENTS
# kills tarball/binary source fetches (the -bin packages); GIT_ALLOW_PROTOCOL=file
# refuses network git while still letting makepkg clone already-cached VCS
# sources locally. An AUR package whose sources aren't cached fails rather than
# downloading. (yay's own PKGBUILD-repo clone and AUR version RPC are recipe
# metadata, not package payloads, and — like a pacman DB sync — are left alone.)
- name: Block makepkg network downloads for --caching force
  when: build_caching | default('available') == 'force'
  blockinfile:
    path: /etc/makepkg.conf
    marker: "# {mark} arch-ansible --caching force"
    block: |
      DLAGENTS=('file::/usr/bin/curl -gqC - -o %o %u'
                'ftp::/usr/bin/false'
                'http::/usr/bin/false'
                'https::/usr/bin/false'
                'rsync::/usr/bin/false'
                'scp::/usr/bin/false')
      export GIT_ALLOW_PROTOCOL=file

- name: Disable git credential helpers
  shell: git config --system credential.helper ""

- name: Back up real systemctl for nspawn passthrough
  copy:
    src: /usr/bin/systemctl
    dest: /usr/bin/systemctl.real
    remote_src: true
    mode: preserve

- name: Install systemctl passthrough (suppress live-only operations in nspawn)
  copy:
    src: systemctl-nspawn-passthrough
    dest: /usr/bin/systemctl
    mode: '0755'

- name: Back up systemd user daemon-reload hook
  copy:
    src: /usr/share/libalpm/hooks/30-systemd-daemon-reload-user.hook
    dest: /usr/share/libalpm/hooks/30-systemd-daemon-reload-user.hook.bak
    remote_src: true

- name: Install no-op systemd user daemon-reload hook
  copy:
    src: systemd-daemon-reload-noop.hook
    dest: /usr/share/libalpm/hooks/30-systemd-daemon-reload-user.hook

- name: Back up real systemd-run for nspawn passthrough
  copy:
    src: /usr/bin/systemd-run
    dest: /usr/bin/systemd-run.real
    remote_src: true
    mode: preserve

- name: Install systemd-run passthrough (bypass systemd bus in nspawn)
  copy:
    src: systemd-run-nspawn-passthrough
    dest: /usr/bin/systemd-run
    mode: '0755'

- name: Back up real makepkg for nspawn
  copy:
    src: /usr/bin/makepkg
    dest: /usr/bin/makepkg.real
    remote_src: true
    mode: preserve

- name: Patch makepkg to allow running as root in nspawn
  replace:
    path: /usr/bin/makepkg
    regexp: 'if \(\( EUID == 0 \)\); then'
    replace: 'if false; then  # nspawn-patched'

- name: Back up real bsdtar for nspawn
  copy:
    src: /usr/bin/bsdtar
    dest: /usr/bin/bsdtar.real
    remote_src: true
    mode: preserve

- name: Wrap bsdtar to skip ownership restoration when building as root in nspawn
  copy:
    content: |
      #!/bin/bash
      exec /usr/bin/bsdtar.real --no-same-owner "$@"
    dest: /usr/bin/bsdtar
    mode: '0755'
