# vim:ft=yaml.ansible:
---
- name: Packaging | Update official packages
  pacman:
    update_cache: yes
    upgrade: yes
  retries: 2
  become: true

- name: Packaging | Install makepkg.conf
  template:
    src: makepkg.conf.j2
    dest: "{{ user_home_dir }}/.makepkg.conf"

- name: Packaging | Check if yay is installed
  shell: which yay
  register: yay_installed
  failed_when: false
  changed_when: false

- name: Packaging | Fix home dir ownership before yay runs in chroot
  become: true
  when: live_iso | default(false)
  file:
    path: "{{ user_home_dir }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.group }}"
    mode: "0755"
    recurse: yes

- name: Packaging | Clone yay-bin from AUR
  become: true
  become_user: "{{ user.name }}"
  git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: /tmp/yay-aur
  when: yay_installed.rc != 0

- name: Packaging | Build yay-bin
  become: true
  become_user: "{{ user.name }}"
  command: makepkg --noconfirm -f
  args:
    chdir: /tmp/yay-aur
  when: yay_installed.rc != 0

- name: Packaging | Install yay-bin
  become: true
  shell: pacman -U --noconfirm /tmp/yay-aur/yay-bin-*.pkg.tar.lzo
  when: yay_installed.rc != 0

- name: Packaging | Install pacman config
  become: true
  copy:
    src: pacman.conf
    dest: /etc/pacman.conf
  when: not (live_iso | default(false))

- name: Packaging | Install yay wrapper for chroot builds
  become: true
  when: live_iso | default(false)
  copy:
    dest: /usr/local/bin/yay
    mode: "0755"
    content: |
      #!/bin/bash
      mkdir -p /tmp/yay-build
      exec /usr/bin/yay --builddir /tmp/yay-build "$@"
