[Unit]
# In a KVM guest the smartcard reader belongs to the host and is reached over
# vsock by pcscd-vsock-guest.service, which provides /run/pcscd/pcscd.comm. The
# local pcscd must not run here, or gpg talks to a cardless local pcscd and
# reports "card not available". Partition it out under KVM, mirroring the
# forwarder's own ConditionVirtualization=kvm: in a guest this condition fails
# and the forwarder owns the socket; on bare metal (host) it passes and the
# local pcscd runs normally. This is a plain condition split with no Conflicts=
# between the units -- see the comment in pcscd-vsock-guest.service for why
# Conflicts= must be avoided.
ConditionVirtualization=!kvm
