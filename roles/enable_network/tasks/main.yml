# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - wireless_tools
      - iwd
      - wireguard-tools
      - systemd-resolvconf

- name: Install systemd preset
  copy:
    src: 80-enable_network.preset
    dest: /usr/lib/systemd/system-preset/80-enable_network.preset

