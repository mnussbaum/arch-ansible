# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - opensc
      - pkcs11-provider
      - systemd-ukify

- name: Install systemd preset
  copy:
    src: 80-systemd-boot.preset
    dest: /usr/lib/systemd/system-preset/80-systemd-boot.preset

- name: Install firstboot script
  copy:
    src: firstboot
    dest: /usr/lib/arch-ansible/bin/firstboot
    mode: "0755"

- name: Install firstboot.service
  copy:
    src: firstboot.service
    dest: /usr/lib/systemd/system/firstboot.service
