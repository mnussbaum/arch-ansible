# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - ccid
      - gnupg
      - imagemagick
      - paperkey
      - pcsclite
      - qrencode
      - yubikey-manager
      - zbar

- name: Install systemd preset
  copy:
    src: 80-gpg.preset
    dest: /usr/lib/systemd/system-preset/80-gpg.preset
