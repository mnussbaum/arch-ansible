# vim:ft=yaml.ansible:
---
- name: Install packages
  package:
    state: present
    name:
      - fuse2
      - restic

- name: Install restic backblaze backup script
  copy:
    src: restic-backblaze-backup
    dest: /usr/local/bin/restic-backblaze-backup
    mode: a+x

- name: Install restic backblaze backup notify service
  copy:
    src: restic-backblaze-backup-notify.service
    dest: /etc/systemd/user/restic-backblaze-backup-notify.service

- name: Install restic backblaze backup service
  copy:
    src: restic-backblaze-backup.service
    dest: /etc/systemd/user/restic-backblaze-backup.service

- name: Install restic backblaze backup timer
  copy:
    src: restic-backblaze-backup.timer
    dest: /etc/systemd/user/restic-backblaze-backup.timer

- name: Enable restic backblaze credential sockets
  become: true
  become_user: "{{ user.name }}"
  systemd:
    enabled: true
    name: "pass-credential@{{ item }}.socket"
    scope: global
    daemon-reload: "{{ svc_daemon_reload }}"
  loop:
    - "{{ inventory_hostname }}-restic_backblaze_key"
    - "{{ inventory_hostname }}-restic_backblaze_key_id"
    - restic_backup_password

- name: Enable restic backblaze backup timer
  become: true
  become_user: "{{ user.name }}"
  systemd:
    enabled: true
    name: restic-backblaze-backup.timer
    scope: global
    daemon-reload: "{{ svc_daemon_reload }}"
# To take a backup:
#
# * sudo mount /dev/sda1 /tmp/usb
