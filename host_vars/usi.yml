---
disk:
  device: /dev/sda

mkinitcpio_modules:
  - nvme
  - intel_agp
  - i915

modprobe_files:
  - i915.conf
  - iwlwifi.conf
  - nvme.conf

key_repeat:
  rate: 35
  delay: 250

window_manager:
  waybar_minimum_workspace_count: 5
  window_manager: sway
  windowing_system: wayland

qemu_host: false

