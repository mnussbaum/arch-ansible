---
# Vars for the dedicated build-time identity (see hosts.yml). The image build
# runs limited to this host, so only host-agnostic, build-time config belongs
# here. Machine-specific config (whether the host is a VM guest or a VM host)
# is detected from facts at firstboot, not baked into the image.
#
# These are common defaults. Remaining host-specific build divergence is being
# migrated to firstboot; until then a single shared value lives here.

modprobe_files:
  - i915.conf
  - iwlwifi.conf
  - nvme.conf
