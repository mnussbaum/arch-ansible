# vim:ft=yaml.ansible:
---
- hosts: all
  handlers:
    - name: Regenerate grub.cfg
      command: grub-mkconfig -o /boot/grub/grub.cfg
      become: true
    - name: Regenerate mkinitcpio ramdisk
      command: mkinitcpio -p linux
      become: true
  roles:
    - mnussbaum.base16-builder-ansible
    - mnussbaum.firefox_ext_sideloader
  tasks:
    - set_fact:
        user_home_dir: "/home/{{ user.name }}"
      tags: [bootstrap, base16, nvim, eeek]
    - set_fact:
        user_config_dir: "{{ user_home_dir }}/.config"
        user_data_dir: "{{ user_home_dir }}/.local/share"
      tags: [bootstrap, base16, nvim, eeek]
    - import_role:
        name: set-appearance-facts
      tags: [bootstrap, base16, rebuild-boot-parition, nvim]
    - import_role:
        name: time
    - import_role:
        name: locale
    - import_role:
        name: vconsole
      tags: [bootstrap]
    - import_role:
        name: bootstrap-packages
      tags: [bootstrap]
    - import_role:
        name: swap
      tags: [bootstrap, rebuild-boot-partition]
      when: grub
    - import_role:
        name: grub
      tags: [bootstrap, rebuild-boot-partition]
      when: grub
    - import_role:
        name: grub-theme
      when: grub
    - import_role:
        name: mkinitcpio
      tags: [bootstrap, rebuild-boot-parition]
    - import_role:
        name: trim
    - import_role:
        name: user
      tags: [bootstrap]
    - import_role:
        name: network_configuration
      tags: [bootstrap, networking]
    - import_role:
        name: enable_network
      tags: [bootstrap, networking]
    - import_role:
        name: reflector
      when: ansible_facts["architecture"] is not match("arm.*")
    - import_role:
        name: packaging
    - set_fact:
        ansible_facts: "{{ ansible_facts | combine({'pkg_mgr': 'yay'}) }}"
      tags: [nvim, base16, eeek]
    - import_role:
        name: gpg
    - import_role:
        name: zsh
    - name: Base16 | Generate color scheme vars
      base16_builder:
        scheme: "{{ base16_scheme }}"
        scheme_family: "{{ base16_scheme_family }}"
        template: []
        schemes_source: "{{ base16['schemes_source'] }}"
        templates_source: "{{ base16['templates_source'] }}"
      register: generated_base16_scheme
      tags: [nvim, base16]
    - set_fact:
        color_scheme_vars: "{{ generated_base16_scheme['schemes'][base16_scheme]['scheme-variables'] }}"
        color_scheme_opacity: "0.7"
      tags: [nvim, base16]
    - import_role:
        name: cli-tools
    - import_role:
        name: python
    - import_role:
        name: rust
    - import_role:
        name: golang
    - import_role:
        name: ruby
    - import_role:
        name: frontend-dev
    - import_role:
        name: global-environment-configuration
    - import_role:
        name: neovim
      tags: [nvim]
    - import_role:
        name: git
    - import_role:
        name: ssh
    - import_role:
        name: wezterm
    - import_role:
        name: tmux
    - import_role:
        name: secrets
    - import_role:
        name: power
    - import_role:
        name: qemu-host
      when: qemu_host
    - import_role:
        name: qemu-guest
      when: ansible_facts["virtualization_type"] == "kvm" and ansible_facts["virtualization_role"] == "guest"
    - import_role:
        name: virtualbox-guest
      when: ansible_facts["virtualization_type"] == "virtualbox" and ansible_facts["virtualization_role"] == "guest"
    - import_role:
        name: fonts
    - import_role:
        name: libinput
    - import_role:
        name: wallpaper
    - import_role:
        name: sway
    - import_role:
        name: waybar
    - import_role:
        name: greeter
    - import_role:
        name: launcher
    - import_role:
        name: qt
    - import_role:
        name: gtk
    - import_role:
        name: polkit
    - import_role:
        name: brightness
    - import_role:
        name: media
    - import_role:
        name: bluetooth
    - import_role:
        name: backup
    - import_role:
        name: torrents
    - import_role:
        name: devops
    - import_role:
        name: archiso
    - import_role:
        name: pdf
    - import_role:
        name: syncthing
    - import_role:
        name: raspberry-pi-dev
      when: ansible_facts["architecture"] is not match("arm.*")
    - import_role:
        name: firefox
    - import_role:
        name: eeek
      tags: [eeek]
    - import_role:
        name: postgres
      tags: [eeek]
    - import_role:
        name: beancount
    - import_role:
        name: claude
