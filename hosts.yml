---
all:
  hosts:
    tecopa:
      ansible_connection: local
    pahrump:
      ansible_connection: local
    bodie:
      ansible_connection: local
    qemu:
      ansible_connection: local
    usi:
      ansible_connection: local
    # Dedicated build-time identity. The image build (postinst-playbook.yml)
    # runs against this host instead of a real machine, so machine-specific
    # config can't leak into the shared image. Machine identity is applied at
    # firstboot.
    build:
      ansible_connection: local
