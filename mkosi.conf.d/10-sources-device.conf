# vim: ft=dosini
# TRANSITIONAL: delete this whole file once builds only ever run in-image (at
# which point /usr is the only source and these can move back into mkosi.conf).
# In-image builder: /root caches don't survive (root=...+absent), so source the
# yay package from the copy mkosi.build embedded in /usr, and password-store
# from its in-image location. Matches when ARCH_ANSIBLE_TARGET=device, set by
# bin/update-system.
[Match]
Environment=ARCH_ANSIBLE_TARGET=device

[Build]
BuildSources=/usr/lib/arch-ansible/yay-pkg:yay-pkg
BuildSources=/usr/share/password-store:password-store

[Content]
ExtraTrees=/usr/share/password-store:/usr/share/password-store
