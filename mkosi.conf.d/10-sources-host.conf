# vim: ft=dosini
# TRANSITIONAL: delete this whole file once builds only ever run in-image.
# Host builder: the yay bootstrap package + password-store come from the
# interactive user's home, and the .chroot postinst's pacman sync DB from the
# host's live system DB (kept fresh by normal pacman use). Matches
# ARCH_ANSIBLE_TARGET=host (default).
[Match]
Environment=ARCH_ANSIBLE_TARGET=host

[Build]
# yay bootstrap: mkosi.build installs yay from yay-bin-*.pkg.tar.zst before the
# postinst runs. The package lives in the local AUR repo (bin/build-image builds
# it on a cold cache; the postinst refreshes it when yay self-upgrades), which
# round-trips to ${ARCH_ANSIBLE_CACHE}/aur-repo via mkosi.finalize's write-back.
# Same dir as the aur-repo BuildSource, just mounted a second time under the stable
# name mkosi.build expects (/work/src/yay-pkg) so it stays host/device-agnostic.
BuildSources=${ARCH_ANSIBLE_CACHE}/aur-repo:yay-pkg
BuildSources=~/.local/share/password-store:password-store

[Content]
ExtraTrees=~/.local/share/password-store:/usr/share/password-store
SkeletonTrees=/var/lib/pacman/sync:/var/lib/pacman/sync
