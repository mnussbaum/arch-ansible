# vim: ft=dosini
# TRANSITIONAL: delete this whole file once builds only ever run in-image.
# Host builder: yay package + password-store come from the interactive user's
# home, and the .chroot postinst's pacman sync DB from the host's live system DB
# (kept fresh by normal pacman use). Matches ARCH_ANSIBLE_TARGET=host (default).
[Match]
Environment=ARCH_ANSIBLE_TARGET=host

[Build]
BuildSources=~/.cache/yay/yay-bin:yay-pkg
BuildSources=~/.local/share/password-store:password-store

[Content]
ExtraTrees=~/.local/share/password-store:/usr/share/password-store
SkeletonTrees=/var/lib/pacman/sync:/var/lib/pacman/sync
