# vim: ft=dosini

[Config]
PassEnvironment=ANSIBLE_EXTRA_ARGS SKIP_POSTINST

[Distribution]
Distribution=arch

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
# Key + cert paths are provided via CLI in bin/build-image; the same software
# ECC P-256 keypair signs SecureBoot, PCR, and verity. pkcs11-provider's
# signing operations were broken for systemd-sbsign + systemd-repart, so we
# can't currently keep the key on a YubiKey.

[Build]
ToolsTree=/
WithNetwork=yes
Incremental=yes
BuildSources=
    .
    ~/.local/share/password-store:password-store
    ~/.cache/yay/yay-bin:yay-pkg
    ~/.cargo/registry:cargo-registry
    ~/.cache/sccache:sccache-cache

CacheDirectory=~/.cache/mkosi
PackageCacheDirectory=~/.cache/mkosi/pacman-pkg
BuildDirectory=~/.cache/mkosi/build
BuildSourcesEphemeral=buildcache
UseSubvolumes=auto

[Output]
Format=disk
Output=arch
ImageId=image
ImageVersion=a
SplitArtifacts=partitions,uki

[Content]
KernelCommandLine=rw
    console=ttyS0
    console=tty0
    root=dissect
    mount.usr=dissect
    systemd.image_policy=usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=image_*
BuildScripts=mkosi.build
BuildPackages=rust
    sccache
PostInstallationScripts=mkosi.postinst.chroot
FinalizeScripts=mkosi.finalize
FinalizeScripts=mkosi.finalize.factory-seed
Bootable=yes
Timezone=US/Pacific
Locale=en_US.UTF-8
CleanPackageMetadata=false
ExtraTrees=
    .:/usr/share/arch-ansible
    ~/.local/share/password-store:/usr/share/password-store
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ~/.cache/mkosi-credstore:/usr/lib/credstore
SkeletonTrees=
    /var/lib/pacman/sync:/var/lib/pacman/sync
    /var/cache/pacman/pkg:/var/cache/pacman/pkg
    ~/.local/share/nvim/site:/etc/skel/.local/share/nvim/site
    ~/.cache/yay:/root/.cache/yay
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ~/.cargo/registry:/root/.cargo/registry
    ~/.cache/sccache:/root/.cache/sccache
Packages=
    ansible
    archlinux-keyring
    base
    btrfs-progs
    base-devel
    ccid
    efibootmgr
    erofs-utils
    git
    intel-ucode
    inetutils
    iptables
    iwd
    libfido2
    linux
    linux-firmware
    linux-headers
    lzop
    mkinitcpio
    mkosi
    pacman
    pass
    gnutls
    opensc
    pcsclite
    go
    npm
    python
    python-passlib
    python-pefile
    python-pystache
    python-pip
    python-pylint
    pyright
    ruff
    rust
    rust-analyzer
    rust-src
    typescript-language-server
    sccache
    uv
    rsync
    socat
    sudo
    systemd-resolvconf
    systemd-ukify
    tmux
    tpm2-tss
    vim
    wireguard-tools
    xdg-user-dirs
    wireless_tools
    zsh
