# vim: ft=dosini

[Config]
PassEnvironment=ANSIBLE_EXTRA_ARGS SKIP_POSTINST

[Distribution]
Distribution=arch

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
# Key + cert paths are provided via CLI in bin/build-image; the same software
# ECC P-256 keypair signs SecureBoot, PCR, and verity. pkcs11-provider's
# signing operations were broken for systemd-sbsign + systemd-repart, so we
# can't currently keep the key on a YubiKey.

[Build]
ToolsTree=/
WithNetwork=yes
Incremental=yes
# TRANSITIONAL (drop after full cutover to in-image builds): selects
# mkosi.conf.d/10-sources-*.conf. Default = host builder.
Environment=ARCH_ANSIBLE_TARGET=host
BuildSources=
    .
    ${ARCH_ANSIBLE_CACHE}/cargo/registry:cargo-registry
    ${ARCH_ANSIBLE_CACHE}/sccache:sccache-cache
    # mkosi's own pacman cache, exposed to the .chroot postinst at
    # /work/src/pacman-cache. mkosi does NOT mount the package cache into
    # .chroot scripts (only into its own install + non-chroot scripts), so the
    # postinst would otherwise re-download every repo package mkosi already
    # fetched. The postinst's pacman lists this as a read-only second CacheDir
    # (postinst-playbook.yml). A BuildSource is bind-mounted live every build,
    # so — unlike a SkeletonTree — it is NOT frozen into the incremental
    # snapshot and always reflects the current cache.
    ${ARCH_ANSIBLE_CACHE}/mkosi/pacman-pkg/cache/pacman/pkg:pacman-cache
    # yay's root clone dir (yay uses /var/cache/yay when running as root). Exposed
    # at /work/src/yay-cache so the postinst can seed /var/cache/yay before yay
    # runs. The SkeletonTree below is frozen into the incremental snapshot and misses
    # any writebacks since it was created; this BuildSource is live every build so
    # it always reflects the latest host cache.
    ${ARCH_ANSIBLE_CACHE}/yay:yay-cache
    # neovim's plugin+parser dir (vim.pack clones and compiled tree-sitter
    # parsers, ~130M). Exposed at /work/src/nvim-site so the postinst can seed
    # /etc/skel/.local/share/nvim/site before the neovim role's headless plugin
    # install runs. Like yay above, the SkeletonTree seed is frozen into the
    # incremental snapshot; this BuildSource is live every build so newly fetched
    # plugins written back by a previous build are seen.
    ${ARCH_ANSIBLE_CACHE}/nvim/site:nvim-site
    # Local repo of pre-built AUR packages (setup-aur.yml PKGDEST=/var/cache/aur-repo).
    # Exposed at /work/src/aur-repo so the postinst can delta-seed /var/cache/aur-repo
    # before installs run. Like yay above, the SkeletonTree seed is frozen into the
    # incremental snapshot; this BuildSource is live every build so packages a
    # previous online build wrote back are seen — which a later --caching force build
    # installs offline via the [aur-local] repo.
    ${ARCH_ANSIBLE_CACHE}/aur-repo:aur-repo
    # TRANSITIONAL: yay-pkg + password-store moved to mkosi.conf.d/10-sources-*.conf

# All cache/scratch lives under ${ARCH_ANSIBLE_CACHE} (bin/_cache_common.sh):
# ~/.cache on the host, /var/cache/arch-ansible on a device. WorkspaceDirectory
# is set explicitly because mkosi otherwise defaults it to the invoking user's
# ~/.cache regardless of CacheDirectory — and that workspace (the sandbox's
# /var/tmp, where systemd-repart stages its ~5G /usr copy) is what overflows the
# small homed /home partition on a device.
CacheDirectory=${ARCH_ANSIBLE_CACHE}/mkosi
PackageCacheDirectory=${ARCH_ANSIBLE_CACHE}/mkosi/pacman-pkg
BuildDirectory=${ARCH_ANSIBLE_CACHE}/mkosi/build
WorkspaceDirectory=${ARCH_ANSIBLE_CACHE}/mkosi
BuildSourcesEphemeral=buildcache
UseSubvolumes=auto

[Output]
Format=disk
ImageId=image
Output=%i_%v_%a
SplitArtifacts=partitions,uki

[Content]
KernelCommandLine=rw
    console=ttyS0
    console=tty0
    root=dissect
    mount.usr=dissect
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=image_*:usr-verity=image_*:usr-verity-sig=image_*
UnifiedKernelImageFormat=%i_%v_%a
# Restrict the appended kernel-modules initrd to a boot-critical set. Left unset,
# mkosi packs *every* module plus its firmware into the UKI's modules initrd —
# that dragged ~145M of modules and ~200M of firmware (nvidia GSP alone ~105M,
# amdgpu, i915, wifi) into early boot, bloating the UKI to ~460M and overflowing
# the ESP on A/B updates. None of that is needed before we pivot into the verity
# /usr, which already carries the full module + firmware tree; udev loads GPU,
# wifi, sound, etc. from there post-pivot.
#   default     - mkosi-initrd's curated set (nvme, dm-crypt/-verity, erofs,
#                 vfat, virtio…); deliberately no full GPU/wifi drivers.
#   xhci_/ehci_ - USB host controllers are modular in the Arch kernel and the
#                 default set omits them; without them a USB keyboard is dead at
#                 the LUKS passphrase prompt. usbhid/hid/usbcore are builtin.
#   aesni_intel - modular; accelerates LUKS decryption of root/swap.
KernelInitrdModules=
    default
    xhci_pci
    xhci_hcd
    ehci_pci
    ehci_hcd
    aesni_intel
BuildPackages=rust
    sccache
FinalizeScripts=mkosi.finalize.factory-seed
Bootable=yes
Timezone=US/Pacific
Locale=en_US.UTF-8
# Self-naming: written to os-release as DEFAULT_HOSTNAME. systemd substitutes each
# '?' with a hex char derived deterministically from the machine-id, so every
# install gets a unique, stable name (e.g. arch-92a9-061c) with no per-machine
# config -- one image provisions many uniquely-named machines, no install-time
# hostname credential needed. Override after install with `hostnamectl hostname`.
Hostname=arch-????-????
CleanPackageMetadata=false
ExtraTrees=
    # Tracked-files-only copy (bin/_cache_common.sh stages it); a raw .: would
    # sweep gitignored secrets into the plaintext /usr.
    ${ARCH_ANSIBLE_SRCTREE}:/usr/share/arch-ansible
    # TRANSITIONAL: password-store moved to mkosi.conf.d/10-sources-*.conf
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ${ARCH_ANSIBLE_CACHE}/mkosi-credstore:/usr/lib/credstore
    # Bake the pacman package cache into /usr so an offline rebuild from a live
    # medium (update-system --image) can install packages without re-downloading
    # ~1G over the network. update-system seeds it into the build's package cache.
    # (~1G of /usr bloat, carried by every image — the price of self-contained
    # offline updates.)
    ${ARCH_ANSIBLE_CACHE}/mkosi/pacman-pkg/cache/pacman/pkg:/usr/lib/arch-ansible/pkg-cache
    # Bake the local AUR repo into /usr for the same reason as pkg-cache above: an
    # offline rebuild from a live medium (update-system --image, --caching force)
    # installs AUR packages from it without network/yay. update-system seeds it into
    # the build's aur-repo cache. Paired with the SkeletonTree/BuildSource below.
    ${ARCH_ANSIBLE_CACHE}/aur-repo:/usr/lib/arch-ansible/aur-repo
SkeletonTrees=
    # The .chroot postinst's pacman package cache is supplied as a BuildSource
    # (pacman-cache, above): a SkeletonTree here would be frozen into the
    # incremental snapshot, whereas the BuildSource is mounted live each build.
    # The sync DB the postinst also needs ('database file for core does not
    # exist' otherwise) is environment-specific — host system DB vs device-local,
    # root-refreshed — so it's seeded from mkosi.conf.d/10-sources-*.conf.
    # neovim plugins + compiled tree-sitter parsers, from the dedicated build
    # cache (not the invoking user's personal nvim). Starts empty and self-primes:
    # the neovim role fetches everything on a cold cache, mkosi.finalize writes the
    # new files back, and bin/build-image folds them into the cache for next build.
    # Paired with the nvim-site BuildSource above (live seed of writebacks since
    # this frozen snapshot was taken).
    ${ARCH_ANSIBLE_CACHE}/nvim/site:/etc/skel/.local/share/nvim/site
    ${ARCH_ANSIBLE_CACHE}/yay:/var/cache/yay
    # Local AUR repo (pre-built packages + aur-local.db). Frozen into the snapshot
    # here; the aur-repo BuildSource live-seeds writebacks since. Under --caching
    # force the postinst installs AUR packages from this via the [aur-local] repo.
    ${ARCH_ANSIBLE_CACHE}/aur-repo:/var/cache/aur-repo
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ${ARCH_ANSIBLE_CACHE}/cargo/registry:/root/.cargo/registry
    ${ARCH_ANSIBLE_CACHE}/sccache:/root/.cache/sccache
Packages=
    ansible
    archlinux-keyring
    base
    btrfs-progs
    base-devel
    ccid
    efibootmgr
    erofs-utils
    git
    intel-ucode
    inetutils
    iptables
    iwd
    libfido2
    linux
    linux-firmware
    linux-headers
    lzop
    mkinitcpio
    mkosi
    pacman
    pass
    gnutls
    opensc
    pcsclite
    go
    npm
    python
    python-passlib
    python-pefile
    python-pystache
    python-pip
    python-pylint
    pyright
    ruff
    rust
    rust-analyzer
    rust-src
    typescript-language-server
    sccache
    uv
    rsync
    socat
    sudo
    systemd-resolvconf
    systemd-ukify
    tmux
    tpm2-tss
    vim
    wireguard-tools
    xdg-user-dirs
    wireless_tools
    zsh
