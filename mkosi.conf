# vim: ft=dosini

[Config]
PassEnvironment=ANSIBLE_EXTRA_ARGS SKIP_POSTINST

[Distribution]
Distribution=arch

[Validation]
SecureBoot=yes
SignExpectedPcr=yes
# Key + cert paths are provided via CLI in bin/build-image; the same software
# ECC P-256 keypair signs SecureBoot, PCR, and verity. pkcs11-provider's
# signing operations were broken for systemd-sbsign + systemd-repart, so we
# can't currently keep the key on a YubiKey.

[Build]
ToolsTree=/
WithNetwork=yes
Incremental=yes
# TRANSITIONAL (drop after full cutover to in-image builds): selects
# mkosi.conf.d/10-sources-*.conf. Default = host builder.
Environment=ARCH_ANSIBLE_TARGET=host
BuildSources=
    .
    ~/.cargo/registry:cargo-registry
    ~/.cache/sccache:sccache-cache
    # TRANSITIONAL: yay-pkg + password-store moved to mkosi.conf.d/10-sources-*.conf

CacheDirectory=~/.cache/mkosi
PackageCacheDirectory=~/.cache/mkosi/pacman-pkg
BuildDirectory=~/.cache/mkosi/build
BuildSourcesEphemeral=buildcache
UseSubvolumes=auto

[Output]
Format=disk
ImageId=image
Output=%i_%v_%a
SplitArtifacts=partitions,uki

[Content]
KernelCommandLine=rw
    console=ttyS0
    console=tty0
    root=dissect
    mount.usr=dissect
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=image_*:usr-verity=image_*:usr-verity-sig=image_*
UnifiedKernelImageFormat=%i_%v_%a
BuildScripts=mkosi.build
BuildPackages=rust
    sccache
PostInstallationScripts=mkosi.postinst.chroot
FinalizeScripts=mkosi.finalize
FinalizeScripts=mkosi.finalize.factory-seed
Bootable=yes
Timezone=US/Pacific
Locale=en_US.UTF-8
CleanPackageMetadata=false
ExtraTrees=
    .:/usr/share/arch-ansible
    # TRANSITIONAL: password-store moved to mkosi.conf.d/10-sources-*.conf
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ~/.cache/mkosi-credstore:/usr/lib/credstore
SkeletonTrees=
    # pkg cache for the .chroot postinst (mkosi's PackageCacheDirectory only
    # covers its own install, not the in-image pacman/yay; without this the
    # postinst re-downloads every package). Empty on first build, filled by
    # mkosi.finalize write-back, reused after — works with no system cache.
    # The sync DB the postinst also needs ('database file for core does not
    # exist' otherwise) is environment-specific — host system DB vs device-local,
    # root-refreshed — so it's seeded from mkosi.conf.d/10-sources-*.conf.
    ~/.cache/arch-ansible/pacman-pkg:/var/cache/pacman/pkg
    ~/.local/share/nvim/site:/etc/skel/.local/share/nvim/site
    ~/.cache/yay:/root/.cache/yay
    /etc/pacman.d/mirrorlist:/etc/pacman.d/mirrorlist
    ~/.cargo/registry:/root/.cargo/registry
    ~/.cache/sccache:/root/.cache/sccache
Packages=
    ansible
    archlinux-keyring
    base
    btrfs-progs
    base-devel
    ccid
    efibootmgr
    erofs-utils
    git
    intel-ucode
    inetutils
    iptables
    iwd
    libfido2
    linux
    linux-firmware
    linux-headers
    lzop
    mkinitcpio
    mkosi
    pacman
    pass
    gnutls
    opensc
    pcsclite
    go
    npm
    python
    python-passlib
    python-pefile
    python-pystache
    python-pip
    python-pylint
    pyright
    ruff
    rust
    rust-analyzer
    rust-src
    typescript-language-server
    sccache
    uv
    rsync
    socat
    sudo
    systemd-resolvconf
    systemd-ukify
    tmux
    tpm2-tss
    vim
    wireguard-tools
    xdg-user-dirs
    wireless_tools
    zsh
