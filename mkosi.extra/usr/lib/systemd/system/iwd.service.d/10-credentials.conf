# Wifi profiles come from credentials encrypted to this machine
# (iwd.network.*, see roles/network_configuration/tasks/wifi-credentials.yml),
# decrypted into a tmpfs state directory on every start so PSKs never touch
# disk. Networks added with iwctl don't survive a restart; add them to pass.
[Service]
StateDirectory=
RuntimeDirectory=iwd
RuntimeDirectoryMode=0700
Environment=STATE_DIRECTORY=/run/iwd
ImportCredential=iwd.network.*
# "+": outside iwd's sandbox (its LimitNPROC=1 would stop the script forking).
# "-": never keep iwd from starting.
ExecStartPre=-+/usr/lib/arch-ansible/bin/iwd-networks-from-credentials
