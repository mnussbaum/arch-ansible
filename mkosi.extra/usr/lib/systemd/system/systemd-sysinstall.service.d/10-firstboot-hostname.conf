# Propagate the *target* machine's hostname onto the freshly installed system, as
# an install-time credential. systemd-sysinstall only carries locale/keymap/timezone
# over on its own (man:systemd-sysinstall(8) deliberately leaves hostname/root to the
# installed system's first boot, and has no --copy-hostname); without this the install
# gets no name.
#
# The target's name is supplied to the installer *explicitly* as a firstboot.hostname
# credential — never derived from the installer's own running hostname, so a reusable
# medium can provision many uniquely-named machines:
#   - QEMU test:     run-image --hostname=NAME  (-> mkosi --credential firstboot.hostname=)
#   - real medium:   a firstboot.hostname.cred in the installer ESP loader/credentials
# ImportCredential pulls that system credential into the service; --load-credential
# forwards it so systemd-sysinstall encrypts it (TPM-locked if available) and writes
# it next to the kernel on the target ESP. On the target's first boot,
# systemd-firstboot.service (shipped enabled, ImportCredential=firstboot.*) consumes
# it and writes the *static* /etc/hostname; later boots ignore it. This is the same
# credential and mechanism used when a disk self-installs from a burned medium.
#
# A target hostname is MANDATORY: if no firstboot.hostname credential is supplied to
# the installer, ImportCredential finds nothing, %d/firstboot.hostname does not exist,
# and systemd-sysinstall fails rather than installing an unnamed system.
#
# firstboot.hostname is new in systemd 261 (same release that gave us
# systemd-sysinstall).
[Service]
ImportCredential=firstboot.hostname
ExecStart=
ExecStart=systemd-sysinstall --variables=yes --reboot=yes --mute-console=yes --load-credential=firstboot.hostname:%d/firstboot.hostname
