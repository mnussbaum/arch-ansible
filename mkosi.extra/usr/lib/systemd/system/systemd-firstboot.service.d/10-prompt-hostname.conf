# Prompt for the hostname at first boot, preselecting the machine-id-derived default
# (mkosi Hostname=). Accept it or type a chosen name. Upstream ExecStart replicated
# with --prompt-hostname added; keep in sync. Blocks on input, so headless first boots
# need the name supplied another way.
[Service]
ExecStart=
ExecStart=systemd-firstboot --prompt-locale --prompt-keymap-auto --prompt-timezone --prompt-hostname --prompt-root-password --mute-console=yes
