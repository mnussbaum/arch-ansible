# PCR 7 only, --strict, with our own recovery PIN; see pcrlock-make-policy.
# pcrlock-enroll-luks.service requires this unit, so without a policy the
# volumes keep their literal PCR 7 binding.
[Unit]
# The initrd's copy of the policy is written to the ESP.
Wants=boot.automount
After=boot.automount

[Service]
# Skip, rather than fail, on TPMs that lack what pcrlock needs (e.g.
# PolicyAuthorizeNV, TPM 2.0 rev < 1.38).
ExecCondition=/usr/lib/systemd/systemd-pcrlock is-supported --quiet
ExecStart=
ExecStart=/usr/bin/pcrlock-make-policy --boot
