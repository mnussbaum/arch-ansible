# Upstream's default prediction covers PCRs 0-5, 7, 11 and 13-15 and silently
# leaves out any PCR it cannot fully account for, with a hidden recovery PIN.
# bin/pcrlock-make-policy makes it exactly PCR 7, --strict, and with a recovery
# PIN we keep on the encrypted root so the policy can heal after an unplanned
# Secure Boot change. See that script for why each matters.
#
# pcrlock-enroll-luks.service requires this unit, so a failure here leaves the
# volumes on their first-boot literal PCR 7 binding rather than on something
# weaker.
[Unit]
ConditionPathExists=/usr/share/arch-ansible/bin/pcrlock-make-policy
# The ESP (gpt-auto's /boot automount) must be reachable, or the initrd's copy
# of the policy is not written. Upstream orders this unit only after /var.
Wants=boot.automount
After=boot.automount

[Service]
ExecStart=
ExecStart=/usr/share/arch-ansible/bin/pcrlock-make-policy --boot
