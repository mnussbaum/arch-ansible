[Partition]
Type=root
Format=btrfs
Label=root
MountPoint=/:"noatime,compress=zstd:1,discard=async,space_cache=v2"
# key-file+tpm2, not plain tpm2: with no --key-file/KeyFile= repart adds a
# ZERO-LENGTH-key keyslot beside the TPM2 one — the documented way to create an
# encrypted partition during early first boot that "receives its user-supplied
# password only in a later setup step" (systemd-repart(8)). That later step is
# luks-enroll-fido2.service, which uses the empty key to authorize enrolling a
# YubiKey and wipes the empty slot in the same call.
#
# Why root needs a second factor at all: the TPM2 token repart enrolls is a
# SIGNED PCR 11 policy, and PCR 11 is extended at every boot phase, so that
# token only unlocks inside the initrd of a normal signed boot. From a recovery
# medium — or any booted system — it cannot, by design. Without a second factor
# a root is unrecoverable the moment its measured boot stops matching (TPM
# cleared, board swapped), and bin/recovery-mount can never open it.
#
# The empty-key slot is a real exposure while it exists: anyone holding the disk
# can open it. luks-enroll-fido2.service therefore runs before first login and
# NEVER leaves that slot behind — it wipes it even when no YubiKey turns up.
Encrypt=key-file+tpm2
FactoryReset=yes
Subvolumes=/var
MakeDirectories=/var/log /var/cache /var/tmp /var/log/journal
SizeMinBytes=4G
# Claim the bulk of the disk: /var/cache/arch-ansible (on this btrfs) holds the
# on-device build's scratch + caches, whose peak (~22G+) overflowed an evenly
# split 22G root. Weight root 3:1 over home (home's real data lives in its own
# homed LUKS, so its partition stays mostly empty).
#
# Root and home are now the ONLY partitions without a SizeMaxBytes, so between
# them they absorb the whole remainder, in the deliberate 3:1 split below, and
# the layout is correct at any disk size. That was not previously true: esp and
# usr-a-verity had no max either, so at the default Weight=1000
# each took a ~1/6 share of free space — 5.9G apiece on the 60G test disk, and
# proportional to the disk (~160G apiece on a 1T NVMe). An earlier version of
# this comment predicted "root ~50G, home ~17G on a 90G disk" by counting only
# root and home; the measured layout never matched, for exactly that reason.
Weight=3000
