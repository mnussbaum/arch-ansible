[Partition]
Type=root
Format=btrfs
Label=root
MountPoint=/:"noatime,compress=zstd:1,discard=async,space_cache=v2"
Encrypt=tpm2
FactoryReset=yes
Subvolumes=/var
MakeDirectories=/var/log /var/cache /var/tmp /var/log/journal
SizeMinBytes=4G
# Claim the bulk of the disk: /var/cache/arch-ansible (on this btrfs) holds the
# on-device build's scratch + caches, whose peak (~22G+) overflowed an evenly
# split 22G root. With usr-a/usr-b now capped at 10G, weight root 3:1 over home
# (home's real data lives in its own homed LUKS, so its partition stays mostly
# empty) → root ~50G, home ~17G on a 90G disk.
Weight=3000
