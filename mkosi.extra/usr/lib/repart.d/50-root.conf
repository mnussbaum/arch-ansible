[Partition]
Type=root
Format=btrfs
Label=root
MountPoint=/:"noatime,compress=zstd:1,discard=async,space_cache=v2"
# Encrypt=tpm2 alone: no bootstrap keyslot is needed, because the TPM2 token can
# authorize enrolling further factors on the volume's own boot. systemd 262's
# systemd-cryptenroll-firstboot.service does exactly that from the initrd, right
# after this partition is created (`--unlock-headless`), and offers a recovery
# key, passphrase or FIDO2 token; `--unlock-tpm2-device=auto` also works later
# from the booted system (measured here, and what AstrOS uses). An earlier version
# added an empty-key slot via key-file+tpm2 on the assumption that the token was
# unusable post-boot; that was wrong — the failure it was inferred from was a
# RECOVERY boot, where a different UKI (and the Live profile's
# SignExpectedPcr=no) means PCR 11 can never match. Dropping it removes a window
# in which an empty password opened root.
Encrypt=tpm2
# Bind the TPM2 keyslot to PCR 7 (Secure Boot state and enrolled certs) as well
# as the signed PCR 11 policy repart adds by default from mkosi's
# SignExpectedPcr= key. PCR 7 alone is brittle across firmware/Secure Boot
# changes; signed PCR 11 alone leaves the seal indifferent to Secure Boot being
# switched off. Together they are what AstrOS ships ("sealed against PCR11+7");
# ParticleOS sets no TPM2PCRs= and so gets PCR 11 only. repart.d gained
# TPM2PCRs= in systemd 259; this image runs 262.
TPM2PCRs=7
FactoryReset=yes
Subvolumes=/var
MakeDirectories=/var/log /var/cache /var/tmp /var/log/journal
SizeMinBytes=4G
# Claim the bulk of the disk: /var/cache/arch-ansible (on this btrfs) holds the
# on-device build's scratch + caches, whose peak (~22G+) overflowed an evenly
# split 22G root. Weight root 3:1 over home (home's real data lives in its own
# homed LUKS, so its partition stays mostly empty).
#
# Root and home are now the ONLY partitions without a SizeMaxBytes, so between
# them they absorb the whole remainder, in the deliberate 3:1 split below, and
# the layout is correct at any disk size. That was not previously true: esp and
# usr-a-verity had no max either, so at the default Weight=1000
# each took a ~1/6 share of free space — 5.9G apiece on the 60G test disk, and
# proportional to the disk (~160G apiece on a 1T NVMe). An earlier version of
# this comment predicted "root ~50G, home ~17G on a 90G disk" by counting only
# root and home; the measured layout never matched, for exactly that reason.
Weight=3000
