[Partition]
Type=usr
Label=_empty
NoAuto=1
# Byte-identical to usr-a — see the rationale in 22-usr-a.conf. Previously this
# slot took an 8G SizeMinBytes floor while usr-a was sized by CopyBlocks=auto, so
# the two differed AND /usr (8.07G) had already outgrown this one, which is what
# broke the A/B update.
SizeMinBytes=16G
SizeMaxBytes=16G
