[Partition]
Type=home
Format=btrfs
Label=home
MountPoint=/home:"noatime,compress=zstd:1,discard=async,space_cache=v2"
FactoryReset=yes
SizeMinBytes=10G
# Low weight: the user's real data lives in a homed LUKS volume on top of this,
# and the device prioritizes build scratch on root (Weight there is 3000), so
# home takes the smaller 1:3 share of the free space.
Weight=1000
