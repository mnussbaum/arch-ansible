[Partition]
Type=usr
Label=%M_%A
CopyBlocks=auto
# Cap the slot: it holds a fixed ~5G dm-verity erofs, so growing the partition
# past it is dead space. Without a max, repart splits the disk evenly across
# every growable partition and this slot devours ~22G that root needs for the
# on-device build's transient scratch (workspace + repart's /usr sizing copy +
# the erofs being written overflow a 22G root). 8G floor keeps A/B symmetric
# with usr-b; 10G ceiling leaves 2x headroom over the current image.
SizeMinBytes=8G
SizeMaxBytes=10G
