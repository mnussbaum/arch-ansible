[Partition]
Type=usr-verity
Label=%M_%A_verity
CopyBlocks=auto
# Fixed, and identical to usr-b-verity (31-usr-b-verity.conf).
#
# The SizeMaxBytes matters as much as the value: without one this partition is
# growable at the default Weight=1000, so repart gives it a share of ALL free
# space alongside root/home/esp — 5.9G on the 60G test disk, and it scales with
# the disk (~160G on a 1T NVMe) to hold a hash tree that is 68 MiB.
SizeMinBytes=512M
SizeMaxBytes=512M
