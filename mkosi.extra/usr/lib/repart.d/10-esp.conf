[Partition]
Type=esp
# Format the ESP when newly created (fresh install onto a blank disk); repart
# leaves the existing build ESP untouched on the first-boot grow.
Format=vfat
# Type #2 install: when repart CREATES this ESP (blank-disk install from a live
# medium, `bin/install-system`), populate it straight from the running medium's
# /boot — systemd-boot (EFI/systemd, EFI/BOOT) + the bare UKI (EFI/Linux/) +
# loader/. This is what makes the install pure Boot Loader Spec Type #2 with no
# `bootctl link`/`systemd-sysinstall` and no Type #1 entries to later GC. Only
# runs on creation, so the installed system's first-boot ESP grow is untouched
# (the partition already exists → no re-copy). Mirrors systemd/particleos#166.
CopyFiles=/boot:/
# Must fit two UKIs simultaneously (A/B sysupdate InstancesMax=2); 1G is too
# small. The 2G minimum is kept in sync with mkosi.repart/00-esp.conf.
#
# SizeMaxBytes is target-only (the medium is sized by mkosi, so it has no free
# space to grab). Without it this partition is growable at the default
# Weight=1000 and repart gives it a share of ALL free space alongside root/home
# — 5.9G on the 60G test disk, scaling with the disk (~160G on a 1T NVMe) to
# hold ~280M of boot loader, UKIs and initrds. Fixing it here makes root the
# only partition that absorbs the remainder, which is what keeps the layout
# sane at every disk size.
SizeMinBytes=2G
SizeMaxBytes=2G
