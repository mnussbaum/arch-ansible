# vim:ft=yaml.ansible:
---
# Store each wifi network from pass as an iwd profile credential encrypted to
# this machine. Credentials can only be encrypted on the machine that decrypts
# them, so this runs at first login, when the YubiKey can decrypt pass. Re-run
# it after changing a network in pass.
- name: Read wifi networks from pass
  command: /usr/bin/wifi-networks
  register: wifi_networks_json
  changed_when: false
  no_log: true

- name: Parse wifi networks
  set_fact:
    wifi_networks: "{{ wifi_networks_json.stdout | from_json }}"
  no_log: true

- name: Store iwd profiles as encrypted credentials
  command:
    argv:
      - sudo
      - -n
      - /usr/bin/store-wifi-credential
      - "{{ item.file }}"
    stdin: "{{ item.profile }}"
  no_log: true
  loop: "{{ wifi_networks }}"

- name: Restart iwd so it loads the new profiles
  command: sudo -n /usr/bin/store-wifi-credential --restart-iwd
  when: wifi_networks | length > 0
