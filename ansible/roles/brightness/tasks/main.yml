# vim:ft=yaml.ansible:
---
- name: Install day-or-night binary
  copy:
    src: day-or-night
    dest: /usr/bin/day-or-night
    mode: a+x

- name: Install wluma-adjust binary
  copy:
    src: wluma-adjust
    dest: /usr/bin/wluma-adjust
    mode: a+x

- name: Create wluma config dir
  file:
    path: /etc/xdg/wluma
    state: directory

- name: Install wluma config
  copy:
    src: wluma-config.toml
    dest: /etc/xdg/wluma/config.toml

- name: Install systemd user preset
  copy:
    src: 80-brightness.preset
    dest: /usr/lib/systemd/user-preset/80-brightness.preset

- name: Install colorscheme-changer binary
  copy:
    src: colorscheme-changer
    dest: /usr/bin/colorscheme-changer
    mode: a+x

- name: Install colorscheme-changer service
  copy:
    src: colorscheme-changer.service
    dest: /usr/lib/systemd/user/colorscheme-changer.service

- name: Install colorscheme-changer timer
  copy:
    src: colorscheme-changer.timer
    dest: /usr/lib/systemd/user/colorscheme-changer.timer

# Disabled for now
- name: Disable colorscheme-changer timer and service
  systemd_service:
    name: "{{ item }}"
    enabled: no
    scope: global
  loop:
    - colorscheme-changer.timer
    - colorscheme-changer.service
