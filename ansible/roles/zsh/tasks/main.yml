# vim:ft=yaml.ansible
---
- name: Install zshrc
  copy:
    dest: /etc/zsh/zshrc
    src: zshrc

- name: Install zlogin
  copy:
    dest: /etc/zsh/zlogin
    src: zlogin

- name: Create zsh config dir
  file:
    path: /etc/zsh
    state: directory

- name: Generate base16 configs
  base16_builder:
    scheme: "{{ base16_scheme }}"
    scheme_family: "{{ base16_scheme_family }}"
    template: shell
    schemes_source: "{{ base16['schemes_source'] }}"
    templates_source: "{{ base16['templates_source'] }}"
  register: base16_shell
  tags: [base16]

- name: Install base16 zsh config
  copy:
    dest: /etc/zsh/00-base16.zsh
    content: "{{ base16_shell['schemes'][base16_scheme]['shell']['scripts']['base16-' + base16_scheme + '.sh'] }}"
  tags: [base16]

- name: Install zsh configs
  synchronize:
    dest: /etc/zsh
    src: zsh-configs/
    perms: false
    rsync_path: "sudo rsync"

- name: Install starship prompt config
  copy:
    dest: /etc/xdg/starship.toml
    src: starship.toml

# Default fnm to /usr/bin/node so cd outside a pinned project doesn't error.
# What `fnm default system` writes; seeded here so new homes get it.
- name: Create skel fnm aliases dir
  file:
    path: /etc/skel/.local/share/fnm/aliases
    state: directory

- name: Default fnm to the system node
  file:
    path: /etc/skel/.local/share/fnm/aliases/default
    src: /dev/null/installation
    state: link
    force: true
