# vim:ft=yaml.ansible:
---
# Firefox only reads user.js and userChrome/userContent.css from the profile, so
# ship one copy in /usr and link it into every profile at each login
# (systemd-tmpfiles --user); profiles then track the image. Linking a profile's
# files also creates it, so homes gain profiles for organizations added later.
- name: Create firefox home config dir
  file:
    path: /usr/share/arch-ansible-home/firefox
    state: directory

- name: Link firefox config into home profiles
  copy:
    content: |
      {% for dir in firefox_profiles.values() %}
      L+ %h/.mozilla/firefox/{{ dir }}/user.js - - - - /usr/share/arch-ansible-home/firefox/user.js
      L+ %h/.mozilla/firefox/{{ dir }}/chrome/userChrome.css - - - - /usr/share/arch-ansible-home/firefox/userChrome.css
      L+ %h/.mozilla/firefox/{{ dir }}/chrome/userContent.css - - - - /usr/share/arch-ansible-home/firefox/userContent.css
      C %h/.mozilla/firefox/{{ dir }}/prefs.js - - - - /usr/share/arch-ansible-home/firefox/prefs.js
      {% endfor %}
    dest: /usr/share/user-tmpfiles.d/arch-ansible-firefox.conf

- name: Create skel firefox dir
  file:
    path: /etc/skel/.mozilla/firefox
    state: directory

- name: Configure firefox profiles.ini
  template:
    dest: /etc/skel/.mozilla/firefox/profiles.ini
    src: firefox-profiles.ini.j2

- name: Install organization profile desktop entries
  template:
    src: firefox-profile.desktop.j2
    dest: "/usr/share/applications/firefox-{{ item }}.desktop"
    mode: "0644"
  loop: "{{ active_organizations.keys() | list }}"

- name: Install organization profile commands
  template:
    src: firefox-profile.sh.j2
    dest: "/usr/bin/firefox-{{ item }}"
    mode: "0755"
  loop: "{{ active_organizations.keys() | list }}"

- name: Install firefox user services
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/systemd/user/{{ item }}"
  loop:
    - firefox.service
    - firefox-profile@.service

# Opens each profile at login, restoring its last session
- name: Install firefox systemd user preset
  template:
    src: 80-firefox.preset.j2
    dest: /usr/lib/systemd/user-preset/80-firefox.preset

- name: Sideload install extensions
  firefox_ext_sideloader:
    path: "{{ item }}"
  with_fileglob:
    - /usr/lib/firefox/browser/extensions/*.xpi

- name: Create firefox policies dir
  file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

# Installs the Dracula theme, which installing also selects, and PersistentPin,
# which re-pins a list of sites at startup; its sync option carries the list
# with each profile's Firefox account.
- name: Install firefox enterprise policies
  copy:
    src: policies.json
    dest: /etc/firefox/policies/policies.json
    mode: "0644"

- name: Configure firefox user.js
  template:
    dest: /usr/share/arch-ansible-home/firefox/user.js
    src: firefox-user.js.j2

# Unlike user.js, prefs.js only seeds new profiles (Firefox rewrites it). The
# welcome URL opens on a profile's first run, prompting a Sync sign-in.
- name: Seed firefox profile prefs
  copy:
    content: |
      user_pref("startup.homepage_welcome_url", "about:preferences#sync");
    dest: /usr/share/arch-ansible-home/firefox/prefs.js

- name: Configure firefox userChrome.css
  template:
    dest: /usr/share/arch-ansible-home/firefox/userChrome.css
    src: firefox-userChrome.css.j2
  tags: [base16]

- name: Configure firefox userContent.css
  template:
    dest: /usr/share/arch-ansible-home/firefox/userContent.css
    src: firefox-userContent.css.j2
  tags: [base16]

- name: Create tridactyl config directory
  file:
    path: /etc/xdg/tridactyl
    state: directory

- name: Create tridactyl config file
  copy:
    src: tridactylrc
    dest: /etc/xdg/tridactyl/tridactylrc
