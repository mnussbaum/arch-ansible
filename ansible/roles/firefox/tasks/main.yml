# vim:ft=yaml.ansible:
---
- name: Create skel profile chrome dirs
  file:
    path: "/etc/skel/.mozilla/firefox/{{ item }}/chrome"
    state: directory
  loop: "{{ firefox_profiles.values() | list }}"

- name: Configure firefox profiles.ini
  template:
    dest: /etc/skel/.mozilla/firefox/profiles.ini
    src: firefox-profiles.ini.j2

- name: Install organization profile desktop entries
  template:
    src: firefox-profile.desktop.j2
    dest: "/usr/share/applications/firefox-{{ item }}.desktop"
    mode: "0644"
  loop: "{{ active_organizations.keys() | list }}"

- name: Install firefox user services
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/systemd/user/{{ item }}"
  loop:
    - firefox.service
    - firefox-profile@.service

# Opens each profile at login, restoring its last session
- name: Install firefox systemd user preset
  template:
    src: 80-firefox.preset.j2
    dest: /usr/lib/systemd/user-preset/80-firefox.preset

- name: Sideload install extensions
  firefox_ext_sideloader:
    path: "{{ item }}"
  with_fileglob:
    - /usr/lib/firefox/browser/extensions/*.xpi

- name: Create firefox policies dir
  file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"

# Installs the Dracula theme, which installing also selects, and PersistentPin,
# which re-pins a list of sites at startup; its sync option carries the list
# with each profile's Firefox account.
- name: Install firefox enterprise policies
  copy:
    src: policies.json
    dest: /etc/firefox/policies/policies.json
    mode: "0644"

- name: Configure firefox user.js
  template:
    dest: "/etc/skel/.mozilla/firefox/{{ item }}/user.js"
    src: firefox-user.js.j2
  loop: "{{ firefox_profiles.values() | list }}"

# Unlike user.js, prefs.js only seeds new profiles. The welcome URL opens on a
# profile's first run, prompting a Sync sign-in.
- name: Seed firefox profile prefs
  copy:
    content: |
      user_pref("startup.homepage_welcome_url", "about:preferences#sync");
    dest: "/etc/skel/.mozilla/firefox/{{ item }}/prefs.js"
  loop: "{{ firefox_profiles.values() | list }}"

- name: Configure firefox userChrome.css
  template:
    dest: "/etc/skel/.mozilla/firefox/{{ item }}/chrome/userChrome.css"
    src: firefox-userChrome.css.j2
  loop: "{{ firefox_profiles.values() | list }}"
  tags: [base16]

- name: Configure firefox userContent.css
  template:
    dest: "/etc/skel/.mozilla/firefox/{{ item }}/chrome/userContent.css"
    src: firefox-userContent.css.j2
  loop: "{{ firefox_profiles.values() | list }}"
  tags: [base16]

- name: Create tridactyl config directory
  file:
    path: /etc/xdg/tridactyl
    state: directory

- name: Create tridactyl config file
  copy:
    src: tridactylrc
    dest: /etc/xdg/tridactyl/tridactylrc
