[Unit]
# In a KVM guest the host's pcscd is relayed over vsock by
# pcscd-vsock-guest.service, so the local one must not run. The exception is a
# YubiKey passed through as USB (bin/vm --yubikey), which sets the pcscd.local
# credential: then the guest runs its own pcscd and the forwarder stands down.
ConditionVirtualization=|!kvm
ConditionCredential=|pcscd.local
