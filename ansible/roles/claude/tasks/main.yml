# vim:ft=yaml.ansible:
---
# Managed settings apply under every CLAUDE_CONFIG_DIR (personal and per
# organization) and track the image, unlike a settings.json seeded into the home,
# which Claude Code also writes to.
- name: Create Claude Code managed settings dir
  file:
    path: /etc/claude-code
    state: directory
    mode: "0755"

- name: Install Claude Code managed settings
  copy:
    src: claude_settings.json
    dest: /etc/claude-code/managed-settings.json
    mode: "0644"

- name: Install Claude Code managed instructions
  copy:
    src: CLAUDE.md
    dest: /etc/claude-code/CLAUDE.md
    mode: "0644"
