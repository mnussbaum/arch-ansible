# vim:ft=yaml.ansible:
---
- name: Enable loop kernel module
  copy:
    content: loop
    dest: /usr/lib/modules-load.d/loop.conf

- name: Install systemd user preset
  copy:
    src: 80-devops.preset
    dest: /usr/lib/systemd/user-preset/80-devops.preset

- name: Create podman socket drop-in dir
  file:
    path: /usr/lib/systemd/user/podman.socket.d
    state: directory

- name: Skip the podman socket for system users
  copy:
    src: skip-system-users.conf
    dest: /usr/lib/systemd/user/podman.socket.d/skip-system-users.conf
    mode: "0644"

- name: Create containers config dirs
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/containers
    - /etc/containers/registries.conf.d

- name: Install containers storage config
  copy:
    src: containers-storage.conf
    dest: /etc/containers/storage.conf

- name: Create the rootless storage parent at boot
  copy:
    src: containers-rootless.tmpfiles
    dest: /usr/lib/tmpfiles.d/containers-rootless.conf

- name: Use the ECR credential helper for registry logins
  copy:
    src: 50-ecr.conf
    dest: /etc/containers/registries.conf.d/50-ecr.conf

- name: Install podman-stop-before-sleep script
  copy:
    src: podman-stop-before-sleep
    dest: /usr/bin/podman-stop-before-sleep
    mode: a+x

- name: Install podman-stop-before-sleep service
  copy:
    src: podman-stop-before-sleep.service
    dest: /usr/lib/systemd/system/podman-stop-before-sleep.service
    mode: "0644"

- name: Create sleep.target.wants directory
  file:
    path: /usr/lib/systemd/system/sleep.target.wants
    state: directory

- name: Stop rootless containers before sleep
  file:
    src: ../podman-stop-before-sleep.service
    dest: /usr/lib/systemd/system/sleep.target.wants/podman-stop-before-sleep.service
    state: link
