# vim:ft=yaml.ansible:
---
- name: Create config dir
  file:
    path: ~/.gnupg
    mode: "0700"
    state: directory

- name: Install config
  copy:
    dest: ~/.gnupg/gpg.conf
    src: gpg.conf
    mode: "0600"

- name: Install gpg-agent config
  copy:
    dest: ~/.gnupg/gpg-agent.conf
    src: gpg-agent.conf
    mode: "0600"

- name: Install scdaemon config
  copy:
    dest: ~/.gnupg/scdaemon.conf
    src: scdaemon.conf
    mode: "0600"

- name: Create user systemd dir
  file:
    path: ~/.config/systemd/user
    state: directory

- name: Find gpg-agent user service configs
  find:
    paths: "/usr/share/doc/gnupg/examples/systemd-user"
    excludes: "README"
    recurse: false
  changed_when: false
  register: gpg_agent_service_configs

- name: Install gpg-agent user service configs
  copy:
    dest: "~/.config/systemd/user/{{ item.path | basename }}"
    src: "{{ item.path }}"
  with_items: "{{ gpg_agent_service_configs.files }}"

- name: Deploy public key file
  copy:
    src: gpg-pubkey.asc
    dest: ~/.gnupg/pubkey.asc
    mode: "0600"
  register: gpg_pubkey_file

- name: Check if GPG key is in keyring
  command: gpg --list-keys "{{ user.gpg_key_uid }}"
  register: gpg_key_check
  failed_when: false
  changed_when: false

- name: Import public key
  command: gpg --import ~/.gnupg/pubkey.asc
  when: gpg_pubkey_file.changed or gpg_key_check.rc != 0

- name: Set ultimate trust on own key
  shell: |
    fingerprint=$(gpg --list-keys --with-colons "{{ user.gpg_key_uid }}" | awk -F: '/^fpr/{print $10; exit}')
    [[ -n "$fingerprint" ]] && echo "$fingerprint:6:" | gpg --import-ownertrust || true
  args:
    executable: /bin/bash
  changed_when: false

# Keygrips of the public key's usable authentication subkeys.
- name: Find YubiKey SSH keygrips
  shell: |
    gpg --show-keys --with-colons --with-keygrip ~/.gnupg/pubkey.asc \
      | awk -F: '$1 == "sub" { auth = $12 ~ /a/ && $2 !~ /[erd]/ } $1 == "grp" && auth { print $10; auth = 0 }'
  args:
    executable: /bin/bash
  register: gpg_auth_ssh_keygrips
  changed_when: false
  failed_when: gpg_auth_ssh_keygrips.rc != 0 or not gpg_auth_ssh_keygrips.stdout

- name: Register YubiKey SSH keygrips in sshcontrol
  lineinfile:
    path: ~/.gnupg/sshcontrol
    line: "{{ item }} 0"
    create: true
  loop: "{{ gpg_auth_ssh_keygrips.stdout_lines }}"

# gpg-agent and dirmngr sockets are enabled in the image
# (mkosi/mkosi.extra/usr/lib/systemd/user/sockets.target.wants/).
