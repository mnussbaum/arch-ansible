# vim:ft=yaml.ansible:
---
# Only /usr ships in the image; move the package's /var/vanta to the factory
# tree that vanta-seed copies it from.
- name: Move /var/vanta into the factory tree
  shell: |
    if [[ -d /var/vanta ]]; then
      rm -rf /usr/share/factory/var/vanta
      mkdir -p /usr/share/factory/var
      mv /var/vanta /usr/share/factory/var/vanta
    fi
  args:
    executable: /bin/bash

- name: Create vanta-agent drop-in dir
  file:
    path: /usr/lib/systemd/system/vanta-agent.service.d
    state: directory

- name: Hold vanta-agent until it is activated
  copy:
    src: parallel/vanta-agent-condition.conf
    dest: /usr/lib/systemd/system/vanta-agent.service.d/arch-ansible-condition.conf

- name: Install vanta-seed
  copy:
    src: parallel/vanta-seed
    dest: /usr/bin/vanta-seed
    mode: "0755"

- name: Seed /var/vanta before each vanta-agent start
  copy:
    src: parallel/vanta-seed.conf
    dest: /usr/lib/systemd/system/vanta-agent.service.d/arch-ansible-seed.conf

- name: Install vanta-agent preset
  copy:
    src: parallel/80-vanta.preset
    dest: /usr/lib/systemd/system-preset/80-vanta.preset

- name: Install vanta-activate
  copy:
    src: parallel/vanta-activate
    dest: /usr/bin/vanta-activate
    mode: "0755"

- name: Allow wheel to run vanta-activate
  copy:
    src: parallel/vanta-sudoers
    dest: /etc/sudoers.d/vanta
    mode: "0440"
    validate: visudo -cf %s

- name: Install tailscaled preset
  copy:
    src: parallel/80-tailscale.preset
    dest: /usr/lib/systemd/system-preset/80-tailscale.preset

- name: Create tailscaled drop-in dir
  file:
    path: /usr/lib/systemd/system/tailscaled.service.d
    state: directory

- name: Start tailscaled disconnected
  copy:
    src: parallel/tailscaled-down.conf
    dest: /usr/lib/systemd/system/tailscaled.service.d/arch-ansible-down.conf

- name: Install tailscale waybar scripts
  copy:
    src: "parallel/{{ item }}"
    dest: "/usr/bin/{{ item }}"
    mode: "0755"
  loop:
    - tailscale-status
    - toggle-tailscale

- name: Allow wheel to bring tailscale up and down
  copy:
    src: parallel/tailscale-sudoers
    dest: /etc/sudoers.d/tailscale
    mode: "0440"
    validate: visudo -cf %s
