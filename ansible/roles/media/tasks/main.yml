# vim:ft=yaml.ansible:
---
- name: Create XDG portal config dir
  file:
    path: /etc/xdg-desktop-portal
    state: directory

- name: Install XDG portal config file
  copy:
    src: sway-portals.conf
    dest: /etc/xdg-desktop-portal/sway-portals.conf

- name: Create wireplumber config dirs
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - /etc/wireplumber
    - /etc/wireplumber/wireplumber.conf.d

- name: Create wireplumber config to enable camera
  copy:
    src: wireplumber-99-libcamera.lua
    dest: /etc/wireplumber/99-libcamera.lua

- name: Create wireplumber config to fix bluetooth mic pops and enable high quality codecs
  copy:
    src: wireplumber-bluez-config.conf
    dest: /etc/wireplumber/wireplumber.conf.d/51-bluez-config.conf

- name: Create wireplumber user unit drop-in dir
  file:
    path: /usr/lib/systemd/user/wireplumber.service.d
    state: directory

- name: Skip wireplumber for system users
  copy:
    src: skip-system-users.conf
    dest: /usr/lib/systemd/user/wireplumber.service.d/skip-system-users.conf
    mode: "0644"

- name: Create xdg-desktop-portal user unit drop-in dir
  file:
    path: /usr/lib/systemd/user/xdg-desktop-portal.service.d
    state: directory

# gtkgreet D-Bus activates the portal, which falls back to the gtk backend and
# fails with "cannot open display" until it hits its start limit
- name: Skip xdg-desktop-portal for system users
  copy:
    src: skip-system-users.conf
    dest: /usr/lib/systemd/user/xdg-desktop-portal.service.d/skip-system-users.conf
    mode: "0644"

- name: Install IPu6 ov01a10 front-facing camera config file
  copy:
    src: ov01a10.yaml
    dest: /usr/share/libcamera/ipa/simple/ov01a10.yaml

- name: Install IPu6 ov01a10 udev config file to fix digital gain
  copy:
    src: 99-ov01a10-digital-gain.rules
    dest: /usr/lib/udev/rules.d/99-ov01a10-digital-gain.rules

- name: Install ipu6-camera-sleep script
  copy:
    src: ipu6-camera-sleep
    dest: /usr/bin/ipu6-camera-sleep
    mode: a+x

- name: Install IPU6 camera release and restore services
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - ipu6-camera-release.service
    - ipu6-camera-restore.service

- name: Create sleep target wants directories
  file:
    path: "/usr/lib/systemd/system/{{ item }}.target.wants"
    state: directory
  loop: [sleep, suspend, hibernate, hybrid-sleep, suspend-then-hibernate]

# Hibernate resume re-registers the camera's sub-devices under wireplumber's
# open descriptors, which crashes the kernel when they're closed
- name: Release the IPU6 camera before sleep
  file:
    src: ../ipu6-camera-release.service
    dest: /usr/lib/systemd/system/sleep.target.wants/ipu6-camera-release.service
    state: link

- name: Restore the IPU6 camera after resume
  file:
    src: ../ipu6-camera-restore.service
    dest: "/usr/lib/systemd/system/{{ item }}.target.wants/ipu6-camera-restore.service"
    state: link
  loop: [suspend, hibernate, hybrid-sleep, suspend-then-hibernate]

- name: Install headphone profile toggle script
  copy:
    src: toggle-headphone-profile
    dest: /usr/bin/toggle-headphone-profile
    mode: a+x

- name: Create mpv config dir
  file:
    path: /etc/xdg/mpv
    state: directory

- name: Create mpv config
  copy:
    src: mpv.conf
    dest: /etc/xdg/mpv/mpv.conf

- name: Install systemd user preset
  copy:
    src: 80-media.preset
    dest: /usr/lib/systemd/user-preset/80-media.preset
