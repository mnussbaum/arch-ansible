# vim:ft=yaml.ansible:
---
- name: Create thermald drop-in directory
  file:
    path: /usr/lib/systemd/system/thermald.service.d
    state: directory

- name: Skip thermald under virtualization and on non-Intel CPUs
  copy:
    src: thermald-condition.conf
    dest: /usr/lib/systemd/system/thermald.service.d/condition.conf
    mode: "0644"

- name: Create TLP drop-in directory
  file:
    path: /etc/tlp.d
    state: directory

- name: Configure TLP
  copy:
    src: tlp.conf
    dest: /etc/tlp.d/50-power.conf
    mode: "0644"

- name: Install per-vendor TLP settings
  copy:
    src: tlp-hardware/
    dest: /usr/lib/tlp-hardware/
    mode: "0644"

- name: Install tlp-hardware-config script
  copy:
    src: tlp-hardware-config
    dest: /usr/bin/tlp-hardware-config
    mode: a+x

# Dangling until tlp-hardware-config runs at boot; TLP skips it until then
- name: Link TLP to the vendor settings selected at boot
  file:
    src: /run/tlp-hardware.conf
    dest: /etc/tlp.d/60-hardware.conf
    state: link
    force: yes

- name: Create TLP service drop-in directory
  file:
    path: /usr/lib/systemd/system/tlp.service.d
    state: directory

- name: Select vendor TLP settings before TLP starts
  copy:
    src: tlp-hardware.conf
    dest: /usr/lib/systemd/system/tlp.service.d/hardware.conf
    mode: "0644"

- name: Configure UPower
  copy:
    src: upower.conf
    dest: /etc/UPower/UPower.conf.d/50-power.conf
    mode: "0644"

- name: Install systemd preset
  copy:
    src: 80-power.preset
    dest: /usr/lib/systemd/system-preset/80-power.preset

- name: Install systemd user preset
  copy:
    src: 80-power-user.preset
    dest: /usr/lib/systemd/user-preset/80-power.preset

- name: Create poweralertd drop-in directory
  file:
    path: /usr/lib/systemd/user/poweralertd.service.d
    state: directory

- name: Limit poweralertd to the system power supplies
  copy:
    src: poweralertd-flags.conf
    dest: /usr/lib/systemd/user/poweralertd.service.d/flags.conf
    mode: "0644"


- name: Create logind drop-in directory
  file:
    path: /usr/lib/systemd/logind.conf.d
    state: directory

- name: Install logind config
  copy:
    src: logind.conf
    dest: /usr/lib/systemd/logind.conf.d/power.conf

- name: Create systemd system.conf drop-in directory
  file:
    path: /usr/lib/systemd/system.conf.d
    state: directory

- name: Set systemd stop timeout to avoid hanging shutdown
  copy:
    src: systemd-timeouts.conf
    dest: /usr/lib/systemd/system.conf.d/timeouts.conf

- name: Create systemd sleep.conf drop-in directory
  file:
    path: /usr/lib/systemd/sleep.conf.d
    state: directory

- name: Install systemd sleep config
  template:
    src: systemd-sleep.conf.j2
    dest: /usr/lib/systemd/sleep.conf.d/power.conf

- name: Create system-sleep script directory
  file:
    path: /usr/lib/systemd/system-sleep
    state: directory

# Elan i2c touchpad click reporting is delayed ~1-2 minutes after resume without this rebind
- name: Install reset-elan-touchpad script
  copy:
    src: reset-elan-touchpad
    dest: /usr/lib/systemd/system-sleep/reset-elan-touchpad
    mode: a+x

- name: Install disable-pm-async service
  copy:
    src: disable-pm-async.service
    dest: /usr/lib/systemd/system/disable-pm-async.service
    mode: "0644"

- name: Create sysctl param directory
  file:
    path: /usr/lib/sysctl.d
    state: directory

- name: Configure sysctl params
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/sysctl.d/{{ item | basename }}"
  with_fileglob:
    - sysctl.d/*

- name: Create udev rules directory
  file:
    path: /usr/lib/udev/rules.d
    state: directory

- name: Configure udev rules
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/udev/rules.d/{{ item | basename }}"
  with_fileglob:
    - udev-rules.d/*
