# vim:ft=yaml.ansible:
---
- name: Create thermald drop-in directory
  file:
    path: /usr/lib/systemd/system/thermald.service.d
    state: directory

- name: Skip thermald under virtualization
  copy:
    src: thermald-condition.conf
    dest: /usr/lib/systemd/system/thermald.service.d/condition.conf
    mode: "0644"

- name: Configure TLP
  copy:
    src: tlp
    dest: /etc/default/tlp

- name: Install systemd preset
  copy:
    src: 80-power.preset
    dest: /usr/lib/systemd/system-preset/80-power.preset


- name: Create logind drop-in directory
  file:
    path: /usr/lib/systemd/logind.conf.d
    state: directory

- name: Install logind config
  copy:
    src: logind.conf
    dest: /usr/lib/systemd/logind.conf.d/power.conf

- name: Create systemd system.conf drop-in directory
  file:
    path: /usr/lib/systemd/system.conf.d
    state: directory

- name: Set systemd stop timeout to avoid hanging shutdown
  copy:
    src: systemd-timeouts.conf
    dest: /usr/lib/systemd/system.conf.d/timeouts.conf

- name: Create systemd sleep.conf drop-in directory
  file:
    path: /usr/lib/systemd/sleep.conf.d
    state: directory

- name: Install systemd sleep config
  template:
    src: systemd-sleep.conf.j2
    dest: /usr/lib/systemd/sleep.conf.d/power.conf

- name: Create system-sleep script directory
  file:
    path: /usr/lib/systemd/system-sleep
    state: directory

# Elan i2c touchpad click reporting is delayed ~1-2 minutes after resume without this rebind
- name: Install reset-elan-touchpad script
  copy:
    src: reset-elan-touchpad
    dest: /usr/lib/systemd/system-sleep/reset-elan-touchpad
    mode: a+x

- name: Create tmpfiles.d directory
  file:
    path: /usr/lib/tmpfiles.d
    state: directory

# Async power management appears to be causing lock ups during suspend and resume
- name: Disable async suspend and resume
  copy:
    src: tmpfiles.d/pm-async.conf
    dest: /usr/lib/tmpfiles.d/pm-async.conf

- name: Create sysctl param directory
  file:
    path: /usr/lib/sysctl.d
    state: directory

- name: Configure sysctl params
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/sysctl.d/{{ item | basename }}"
  with_fileglob:
    - sysctl.d/*

- name: Create udev rules directory
  file:
    path: /usr/lib/udev/rules.d
    state: directory

- name: Configure udev rules
  copy:
    src: "{{ item }}"
    dest: "/usr/lib/udev/rules.d/{{ item | basename }}"
  with_fileglob:
    - udev-rules.d/*

- name: Enable audio codec power management
  copy:
    content: "options snd_hda_intel power_save=1 power_save_controller=Y"
    dest: "/usr/lib/modprobe.d/audio_powersave.conf"
