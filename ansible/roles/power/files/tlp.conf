# Overrides of /usr/share/tlp/defaults.conf; see tlp-stat -c for effective values.
# Per-vendor settings are in tlp-hardware/, selected by tlp-hardware-config.

CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# L1 substates on battery
PCIE_ASPM_ON_BAT=powersupersave

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# Dell EC only honors these in Custom charge mode
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=85
