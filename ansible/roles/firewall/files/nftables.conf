#!/usr/bin/nft -f
# Own table only; never `flush ruleset`, which would wipe the tables tailscaled
# and podman manage when nftables.service restarts after them.
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept

    # IPv6 doesn't work without neighbor discovery, RAs and PMTU.
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert,
                  packet-too-big, destination-unreachable, time-exceeded,
                  parameter-problem } accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
    icmp type echo-request limit rate 5/second accept
    icmpv6 type echo-request limit rate 5/second accept

    # DHCP renewals arrive on the client ports (discovery uses raw sockets).
    udp dport 68 accept
    ip6 saddr fe80::/10 udp dport 546 accept

    # Syncthing sync and LAN discovery, on every network: peers are
    # authenticated by device ID.
    tcp dport 22000 accept
    udp dport { 21027, 22000 } accept
  }
}

# Other roles append input rules here.
include "/etc/nftables.d/*.nft"
