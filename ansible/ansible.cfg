[defaults]
interpreter_python=/usr/bin/python
inventory = {{CWD}}/hosts.yml
roles_path = vendor/roles
collections_path = vendor/collections
allow_world_readable_tmpfiles = True

# Make debug output YAML
callback_result_format = yaml
bin_ansible_callbacks = True
callbacks_enabled = profile_tasks

[connection]
# Streams each module to the interpreter's stdin instead of writing and
# chmod-ing a temp file per task, which dominates the postinst's per-task cost.
pipelining = True

[chroot_connection]
exe = arch-chroot
