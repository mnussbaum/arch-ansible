---
# Real machines are NOT listed here. An installed machine provisions itself
# against an implicit localhost (bin/ansible, when ARCH_ANSIBLE_IDENTITY is unset),
# so its self-assigned hostname never has to match an inventory entry. group_vars/all
# applies uniformly; per-machine traits come from runtime hardware detection.
all:
  hosts:
    # Dedicated build-time identity. The image build (postinst-playbook.yml) runs
    # against this host (ARCH_ANSIBLE_IDENTITY=build) instead of a real machine, so
    # machine-specific config can't leak into the shared image.
    build:
      ansible_connection: local
