# vim:ft=yaml.ansible:
---
# Runs tasks as a user on their first login, and again on their first login after
# an image update that changes this playbook's inputs (zlogin compares the marker
# below with the digest mkosi.postinst.chroot records in os-release).
# Runs from user shell configs, blocking user interaction until it completes.
# Should be used for home state that needs the user's secrets or YubiKey, or
# machine role specific user services that aren't known until runtime, and must
# be safe to re-run. Plain config files don't belong here: install them
# system-wide (/etc/xdg and the like) or link them into homes with user tmpfiles
# (/usr/share/user-tmpfiles.d) in postinst-playbook.yml, so they track the image.
- hosts: all
  tasks:
    - import_role:
        name: user
        tasks_from: first-login
    - import_role:
        name: gpg
        tasks_from: user
    # Needs the YubiKey-backed gpg agent above to decrypt the wifi entries in pass.
    - import_role:
        name: network_configuration
        tasks_from: wifi-credentials
    - import_role:
        name: organizations
        tasks_from: user
    - import_role:
        name: postgres
        tasks_from: pgpass
    - import_role:
        name: firefox
        tasks_from: user
    - name: Record the playbook digest this home was provisioned for
      shell: grep '^ARCH_ANSIBLE_USER_PLAYBOOK_DIGEST=' /usr/lib/os-release > ~/.config/user-first-login-done
