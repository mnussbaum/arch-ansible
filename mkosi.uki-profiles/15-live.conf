# Live/Recovery: a volatile tmpfs root with the image's /usr over it, for
# repairing an installed disk (bin/recovery-mount) without touching it.
#
# systemd.firstboot=off because nothing here survives the boot: first-boot setup
# has nothing to set up, and without this it stops on tty0 asking for a hostname
# nobody will ever see again (locale/timezone come from the baked credstore, and
# the root password from the credential below, so the hostname was the one
# prompt left). The Installer profile has always had it.
#
# It only stops firstboot ASKING. systemd-homed-firstboot still runs unattended
# here, because ImportCredential=home.* hands it the user record, and it builds
# a fresh ~3.4G LUKS home in RAM on every boot. That is deliberate: this profile
# has no systemd.unit= override, so it boots the image default, graphical.target
# with greetd — and without that account there is nobody to log in as, only root
# on a VT. The Installer masks it instead (root-only on multi-user.target).
#
# NOTE: comments must stay OUT of the Cmdline= block below — its continuation
# lines are values, so a # line risks ending up on the kernel command line.
[UKIProfile]
Profile=
        ID=live
        TITLE=Live System

Cmdline=
        root=tmpfs
        mount.usr=dissect
        systemd.firstboot=off
        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        # NvPCRs (systemd 262+) can only be anchored from an initrd whose UKI
        # embeds a signed PCR policy bound to the initrd phase, which this
        # profile deliberately lacks (SignExpectedPcr=no, below): anything it
        # signed would also satisfy an installed root's signed PCR 11 policy.
        # Without it every NvPCR define fails (ENOENT) and these units fail the
        # boot. Nothing here needs TPM measurements, so skip them.
        rd.systemd.mask=systemd-tpm2-setup-early.service
        systemd.mask=systemd-tpm2-setup-early.service
        systemd.mask=systemd-tpm2-setup.service
        systemd.mask=systemd-pcrproduct.service
        systemd.mask=systemd-pcrlogin@.service
        # pcrlock would allocate a TPM NV index and write its policy credential
        # to the medium's ESP; neither belongs to a live/installer boot.
        systemd.mask=systemd-pcrlock-make-policy.service
        systemd.mask=systemd-pcrlock-secureboot-policy.service
        systemd.mask=systemd-pcrlock-secureboot-authority.service
        systemd.mask=pcrlock-enroll-luks.service
        systemd.set-credential=passwd.plaintext-password.root:root
        systemd.set-credential=agetty.autologin:root
        systemd.set-credential=login.noauth:yes
        SYSTEMD_SULOGIN_FORCE=1
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
        systemd.image_filter=usr=image_*:usr-verity=image_*:usr-verity-sig=image_*
        ipe.enforce=0

SignExpectedPcr=no
