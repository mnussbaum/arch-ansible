[UKIProfile]
Profile=
        ID=install
        TITLE=Installer

# Auto-runs the guided installer on tty1 (arch-install.service, gated on the
# `arch.install` marker below), which enumerates target disks, then does a single
# systemd-repart run producing a pure Type #2 ESP — see bin/install-system and
# mkosi.extra/usr/lib/repart.d/10-esp.conf. No longer runs systemd-sysinstall:
# that installs the kernel via `bootctl link` (Boot Loader Spec Type #1), which
# systemd-sysupdate's Type #2 A/B rotation can't GC (systemd/particleos#166).
# The guided menu offers "drop to a shell", and the other VTs autologin root as a
# second escape hatch.
#
# systemd-repart.service stays masked so the medium doesn't provision ITSELF
# here; install-system drives repart against the chosen TARGET explicitly.
Cmdline=
        root=tmpfs
        mount.usr=dissect
        arch.install
        # Ephemeral tmpfs installer: skip systemd-firstboot's interactive
        # hostname/locale prompt so boot goes straight to the guided menu.
        systemd.firstboot=off
        # Boot to multi-user.target (text mode), not graphical.target, so the baked
        # graphical login (greetd/sway, present in a full postinst build) does NOT
        # take over the console before the guided installer on tty1.
        # arch-install.service is WantedBy=multi-user.target.
        systemd.unit=multi-user.target
        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        # NvPCRs (systemd 262+) can only be anchored from an initrd whose UKI
        # embeds a signed PCR policy bound to the initrd phase, which this
        # profile deliberately lacks (SignExpectedPcr=no, below): anything it
        # signed would also satisfy an installed root's signed PCR 11 policy.
        # Without it every NvPCR define fails (ENOENT) and these units fail the
        # boot. Nothing here needs TPM measurements, so skip them.
        rd.systemd.mask=systemd-tpm2-setup-early.service
        systemd.mask=systemd-tpm2-setup-early.service
        systemd.mask=systemd-tpm2-setup.service
        systemd.mask=systemd-pcrproduct.service
        systemd.mask=systemd-pcrlogin@.service
        systemd.mask=systemd-homed-firstboot.service
        systemd.set-credential=passwd.plaintext-password.root:root
        systemd.set-credential=agetty.autologin:root
        systemd.set-credential=login.noauth:yes
        SYSTEMD_SULOGIN_FORCE=1
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
        systemd.image_filter=usr=image_*:usr-verity=image_*:usr-verity-sig=image_*
        ipe.enforce=0

SignExpectedPcr=no
