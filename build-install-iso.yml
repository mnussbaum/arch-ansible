# vim:ft=yaml.ansible:
---
- hosts: all
  tasks:
    - name: Create temp build dir
      tempfile:
        state: directory
        suffix: archiso-build
        path: /var/tmp
      register: iso_build_temp_dir

    - set_fact:
        iso_build_dir: "{{ iso_build_temp_dir.path }}"
        # iso_build_dir: "<HARD CODE HERE FOR DEBUGING>"
    - set_fact:
        airootfs: "{{ iso_build_dir }}/airootfs"
    - set_fact:
        root_user_dir: "{{ airootfs }}/root"
    - set_fact:
        pacman_db_dest_dir: "{{ root_user_dir }}/pacman_dbs"

    - block:
        - name: Populate temp dir
          synchronize:
            src: /usr/share/archiso/configs/releng/
            dest: "{{ iso_build_dir }}"
            perms: false

        - name: Ignore iptables-legacy to resolve libxtables provider conflict
          lineinfile:
            path: "{{ iso_build_dir }}/pacman.conf"
            regexp: '^#?IgnorePkg'
            line: 'IgnorePkg = iptables-legacy'

        - name: Create pacman DB directory
          file:
            path: "{{ pacman_db_dest_dir }}"
            state: directory
        - name: Add pacman DBs to allow pre-networking package presence checks
          copy:
            src: "/var/lib/pacman/sync/{{ item }}"
            dest: "{{ pacman_db_dest_dir }}/{{ item }}"
          loop:
            - core.db
            - extra.db

        - name: Install vconsole configuration
          import_role:
            name: vconsole
          vars:
            vconsole_install_root: "{{ airootfs }}"
        - name: Install network configuration
          import_role:
            name: network_configuration
          vars:
            network_install_root: "{{ airootfs }}"

        - name: Install files into root user dir
          import_role:
            name: bootstrapping
            tasks_from: install-user-files
          become: true
          vars:
            user_home_dir: "{{ root_user_dir }}"
            ansible_dest_dir: "{{ root_user_dir }}/arch-ansible"
            user_name: root

        - name: Check if password-store is available locally
          stat:
            path: "{{ ansible_env.HOME }}/.local/share/password-store"
          register: local_password_store

        - name: Copy password-store into ISO from local machine
          synchronize:
            src: "{{ ansible_env.HOME }}/.local/share/password-store/"
            dest: "{{ root_user_dir }}/password-store"
            perms: false
          when: local_password_store.stat.exists

        - name: Link password-store for pass
          file:
            src: "{{ root_user_dir }}/password-store"
            dest: "{{ root_user_dir }}/.password-store"
            state: link
          when: local_password_store.stat.exists

        - name: Clone password-store into ISO from remote
          git:
            repo: git@gitlab.com:mnussbaum/password-store.git
            dest: "{{ root_user_dir }}/password-store"
            accept_hostkey: yes
            update: false
          when: not local_password_store.stat.exists

        - name: Add pacakges
          lineinfile:
            dest: "{{ iso_build_dir }}/packages.x86_64"
            line: "{{ item }}"
          loop: "{{ bootstrap_packages }}"

        - name: Create bootstrap pkg-cache in ISO
          file:
            path: "{{ airootfs }}/root/pkg-cache"
            state: directory
          become: true

        - name: Download bootstrap packages to local cache
          command: pacman -Sw --noconfirm {{ bootstrap_packages | join(' ') }}
          become: true

        - name: Copy bootstrap packages into ISO pkg-cache
          shell: >
            find /var/cache/pacman/pkg -name '{{ item }}-[0-9]*.pkg.tar.zst*'
            -exec cp {} "{{ airootfs }}/root/pkg-cache/" \;
          loop: "{{ bootstrap_packages }}"
          become: true
          changed_when: true

        - name: Deploy pcscd vsock forwarding service to ISO
          become: true
          copy:
            src: "{{ playbook_dir }}/roles/qemu-guest/files/pcscd-vsock-forward.service"
            dest: "{{ airootfs }}/etc/systemd/system/pcscd-vsock-forward.service"
            mode: "0644"

        - name: Create multi-user.target.wants directory in ISO
          become: true
          file:
            path: "{{ airootfs }}/etc/systemd/system/multi-user.target.wants"
            state: directory
            mode: "0755"

        - name: Enable pcscd vsock forwarding service in ISO
          become: true
          file:
            src: /etc/systemd/system/pcscd-vsock-forward.service
            dest: "{{ airootfs }}/etc/systemd/system/multi-user.target.wants/pcscd-vsock-forward.service"
            state: link
            force: true

        - name: Create root gnupg directory in ISO
          become: true
          file:
            path: "{{ root_user_dir }}/.gnupg"
            state: directory
            mode: "0700"

        - name: Deploy gpg-agent config for ISO
          become: true
          copy:
            dest: "{{ root_user_dir }}/.gnupg/gpg-agent.conf"
            mode: "0600"
            content: |
              pinentry-program /usr/bin/pinentry-curses
              enable-ssh-support
              default-cache-ttl 3600
              max-cache-ttl 3600
              default-cache-ttl-ssh 3600
              max-cache-ttl-ssh 3600

        - name: Deploy scdaemon config for ISO
          become: true
          copy:
            src: "{{ playbook_dir }}/roles/gpg/files/scdaemon.conf"
            dest: "{{ root_user_dir }}/.gnupg/scdaemon.conf"
            mode: "0600"

        - name: Import GPG public key into ISO root keyring
          become: true
          command: >
            gpg --homedir {{ root_user_dir }}/.gnupg
            --import {{ playbook_dir }}/roles/gpg/files/gpg-pubkey.asc
          register: gpg_import
          changed_when: "'imported' in gpg_import.stderr"

        - name: Set ultimate trust on GPG key in ISO
          become: true
          shell: |
            fingerprint=$(gpg --homedir {{ root_user_dir }}/.gnupg --list-keys --with-colons "{{ user.gpg_key_uid }}" | awk -F: '/^fpr/{print $10; exit}')
            echo "$fingerprint:6:" | gpg --homedir {{ root_user_dir }}/.gnupg --import-ownertrust
          args:
            executable: /bin/bash
          changed_when: false

        - name: Register SSH auth keygrip in ISO root sshcontrol
          become: true
          lineinfile:
            path: "{{ root_user_dir }}/.gnupg/sshcontrol"
            line: "{{ item }} 0"
            create: yes
            mode: "0600"
          loop: "{{ gpg_auth_ssh_keygrips }}"

        - name: Install customize_airootfs.sh to restore exact git-tracked permissions
          copy:
            dest: "{{ airootfs }}/root/customize_airootfs.sh"
            mode: "0755"
            content: |
              #!/bin/bash
              set -e
              git -C /root/arch-ansible ls-files -z --stage | \
              while IFS= read -r -d '' line; do
                  mode="${line:0:6}"
                  file="${line##*$'\t'}"
                  if [[ "$mode" == "100755" ]]; then
                      chmod 755 "/root/arch-ansible/$file"
                  else
                      chmod 644 "/root/arch-ansible/$file"
                  fi
              done
              chmod 700 /root/arch-ansible/secrets
              chmod 600 /root/arch-ansible/secrets/vault-password

        - name: Build ISO
          become: true
          command: "mkarchiso -v -w {{ iso_build_dir }}/work -o {{ iso_build_dir }}/out {{ iso_build_dir }}"
          args:
            creates: "{{ iso_build_dir }}/out/*.iso"
            chdir: "{{ iso_build_dir }}"

        - name: Inspect built images
          register: built_images
          find:
            paths: "{{ iso_build_dir }}/out"
            patterns: "*.iso"

        - name: Fail if there isn't exactly one image found
          when: built_images.matched != 1
          fail:
            msg: "Incorrect image file count in {{ iso_build_dir }}/out"

        - name: Write out ISO file
          become: true
          command: "dd bs=4M if={{ item.path }} of={{ iso_output_file }} oflag=sync"
          loop: "{{ built_images.files }}"

      always:
        - name: Cleanup
          become: true
          file:
            path: "{{ iso_build_dir }}"
            state: absent
