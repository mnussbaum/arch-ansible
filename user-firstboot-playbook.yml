# vim:ft=yaml.ansible:
---
# Runs tasks as a user once, when a user first logs in. Runs from user shell
# configs, blocking user interaction until it completes. Should be used for
# configuring files in the user's home dir, and running machine role specific
# user services that aren't known until runtime. It's preferable to put tasks
# in the postinst-playbook.yml file to execute them at image build time to keep
# user provisioning fast and reliable
- hosts: all
  tasks:
    - import_role:
        name: gpg
        tasks_from: user
    - import_role:
        name: ssh
    - import_role:
        name: eeek
        tasks_from: user
    - import_role:
        name: postgres
        tasks_from: pgpass
    - name: Mark user firstboot complete
      file:
        path: "~/.config/user-firstboot-done"
        state: touch
        mode: "0600"
