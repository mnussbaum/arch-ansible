[project]
name = "arch-ansible-tools"
version = "0.1.0"
description = "QEMU harness and CI tasks for testing this repo's image"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "markdown",  # bin/_recovery_guide.py, under test
  "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["arch_ansible_vm", "arch_ansible_ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.pyright]
venvPath = "."
venv = ".venv"
