[project]
name = "arch-ansible-tools"
version = "0.1.0"
description = "QEMU harness and CI tasks for testing this repo's image"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "markdown",  # bin/_recovery_guide.py, under test
  "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["arch_ansible_vm", "arch_ansible_ci"]

[tool.pytest.ini_options]
# The end-to-end stages boot VMs, so they run only when named: bin/ci test.
testpaths = ["tests/unit"]
addopts = ["--strict-markers"]
markers = [
  "install: stage 3, the medium's Installer writes an installable disk",
  "first_boot: stage 4, the installed disk's first and second boots",
  "session: stage 5, first login with a software token, pass, the desktop and nvim",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
