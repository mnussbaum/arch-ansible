# vim: ft=dosini
# Extends mkosi's default initrd. Ship the console keymap so the LUKS prompt and
# initrd emergency shell get CapsLock→Escape too; mkosi only does this for the
# standalone mkosi-initrd tool, not the image's default initrd.

[Content]
ExtraTrees=
    ../mkosi.extra/etc/vconsole.conf:/etc/vconsole.conf
    ../roles/vconsole/files/us-custom.map:/usr/share/kbd/keymaps/i386/qwerty/us-custom.map
