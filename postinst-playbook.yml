# vim:ft=yaml.ansible:
---
# Runs during the image build process. Runs within the chroot of the just built
# image. Services can't be enabled directly in this playbook, instead create
# a preset file so that the service will be enabled at image boot
- hosts: all
  environment:
    BUILDDIR: /tmp/makepkg
  roles:
    - mnussbaum.base16-builder-ansible
    - mnussbaum.firefox_ext_sideloader
  pre_tasks:
    - name: Create arch-ansible bin directory
      file:
        path: /usr/lib/arch-ansible/bin
        state: directory
    - import_role:
        name: packaging
        tasks_from: install-pacman-conf
      vars:
        disable_sandbox: true
        # --caching force: block package downloads during the build so installs
        # come only from cache. Scoped to this pre-task only; the post_tasks
        # re-render omits it, so the shipped image keeps a network pacman.conf.
        pacman_caching: "{{ build_caching | default('available') }}"
        # Reuse repo packages mkosi already downloaded: its package cache is
        # mounted at /work/src/pacman-cache (BuildSources in mkosi.conf). Listed
        # after the in-image cache so new downloads still go to the latter.
        # Build-only like the vars above — dropped by the post_tasks re-render.
        pacman_cache_dirs: "/var/cache/pacman/pkg /work/src/pacman-cache"
      tags: [packaging, min-user-session]
    - import_role:
        name: packaging
        tasks_from: init-keyring
      tags: [packaging, min-user-session]
  post_tasks:
    - import_role:
        name: packaging
        tasks_from: install-pacman-conf
      vars:
        disable_sandbox: false
      tags: [packaging, min-user-session]
    # mkosi now INSTALLS the AUR packages itself (mkosi.conf PackageDirectories=
    # points pacman at the same /var/cache/aur-repo, and they are listed in
    # mkosi.conf.d/90-packages.conf), which is why no role has a `package:` task
    # any more. yay is still what BUILDS them, though, so without this the repo
    # would freeze at whatever versions it already holds and the image would
    # never see an AUR update again. -Sua upgrades exactly the AUR packages that
    # are installed — i.e. the set mkosi just installed — building any newer
    # version into PKGDEST for the DB rebuild below and for the next build.
    # MUST run before restore-build-overrides below: that puts the real
    # systemd-run, makepkg and sudo back, and yay then dies with "System has
    # not been booted with systemd as init system" inside the chroot.
    - name: Rebuild AUR packages that have newer versions
      shell: yay -Sua --noconfirm
      args:
        executable: /bin/bash
      changed_when: true
      when: build_caching | default('available') != 'force'
      tags: [packaging, min-user-session]
    - import_role:
        name: packaging
        tasks_from: restore-build-overrides
      tags: [packaging, min-user-session]
    - name: Apply user-unit presets (mkosi only presets system units)
      command: systemctl --global preset-all
      changed_when: false
      tags: [min-user-session]
  tasks:
    - import_role:
        name: set-appearance-facts
      tags: [set-appearance-facts, min-user-session]
    - import_role:
        name: vconsole
      tags: [vconsole, min-user-session]
    - import_role:
        name: systemd-boot
      tags: [systemd-boot, min-user-session]
    - import_role:
        name: qemu-guest
      tags: [qemu-guest]
    - import_role:
        name: qemu-host
      tags: [qemu-host]
    - import_role:
        name: user
      tags: [user, min-user-session]
    - import_role:
        name: gpg
        tasks_from: packaging
      tags: [gpg]
    - import_role:
        name: network_configuration
      tags: [network_configuration]
    - import_role:
        name: enable_network
      tags: [enable_network]
    - import_role:
        name: reflector
      tags: [reflector]
    - import_role:
        name: packaging
        tasks_from: setup-aur
      tags: [packaging, min-user-session]
    - import_role:
        name: secrets
      tags: [secrets]
    - import_role:
