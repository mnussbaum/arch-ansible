# vim:ft=yaml.ansible:
---
# Runs during the image build process. Runs within the chroot of the just built
# image. Services can't be enabled directly in this playbook, instead create
# a preset file so that the service will be enabled at image boot
- hosts: all
  environment:
    BUILDDIR: /tmp/makepkg
  roles:
    - mnussbaum.base16-builder-ansible
    - mnussbaum.firefox_ext_sideloader
  pre_tasks:
    - set_fact:
        ansible_facts: "{{ ansible_facts | combine({'pkg_mgr': 'pacman'}) }}"
    - name: Create arch-ansible bin directory
      file:
        path: /usr/lib/arch-ansible/bin
        state: directory
    - import_role:
        name: packaging
        tasks_from: install-pacman-conf
      vars:
        disable_sandbox: true
      tags: [packaging, min-user-session]
    - import_role:
        name: packaging
        tasks_from: init-keyring
      tags: [packaging, min-user-session]
  post_tasks:
    - import_role:
        name: packaging
        tasks_from: install-pacman-conf
      vars:
        disable_sandbox: false
      tags: [packaging, min-user-session]
    - import_role:
        name: packaging
        tasks_from: restore-build-overrides
      tags: [packaging, min-user-session]
  tasks:
    - import_role:
        name: set-appearance-facts
      tags: [set-appearance-facts, min-user-session]
    - import_role:
        name: vconsole
      tags: [vconsole, min-user-session]
    - import_role:
        name: systemd-boot
      tags: [systemd-boot, min-user-session]
    - import_role:
        name: qemu-guest-agent
      tags: [qemu-guest-agent]
    - import_role:
        name: user
      tags: [user, min-user-session]
    - import_role:
        name: gpg
        tasks_from: packaging
      tags: [gpg]
    - import_role:
        name: network_configuration
      tags: [network_configuration]
    - import_role:
        name: enable_network
      tags: [enable_network]
    - import_role:
        name: reflector
      tags: [reflector]
    - import_role:
        name: packaging
        tasks_from: setup-aur
      tags: [packaging, min-user-session]
    - import_role:
        name: secrets
      tags: [secrets]
    - import_role:
        name: zsh
      tags: [zsh, min-user-session]
    - import_role:
        name: cli-tools
      tags: [cli-tools]
    - import_role:
        name: ruby
      tags: [ruby]
    - import_role:
        name: python
      tags: [python]
    - import_role:
        name: rust
      tags: [rust]
    - import_role:
        name: golang
      tags: [golang]
    - import_role:
        name: frontend-dev
      tags: [frontend-dev]
    - import_role:
        name: global-environment-configuration
      tags: [global-environment-configuration, min-user-session]
    - import_role:
        name: neovim
      tags: [neovim]
    - import_role:
        name: git
      tags: [git, min-user-session]
    - import_role:
        name: wezterm
      tags: [wezterm, min-user-session]
    - import_role:
        name: tmux
      tags: [tmux, min-user-session]
    - import_role:
        name: power
      tags: [power]
    - import_role:
        name: fonts
      tags: [fonts, min-user-session]
    - import_role:
        name: libinput
      tags: [libinput]
    - import_role:
        name: wallpaper
      tags: [wallpaper, min-user-session]
    - import_role:
        name: sway
      tags: [sway, min-user-session]
    - import_role:
        name: waybar
      tags: [waybar, min-user-session]
    - import_role:
