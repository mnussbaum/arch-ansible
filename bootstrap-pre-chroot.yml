# vim:ft=yaml.ansible:
---
- hosts: all
  tasks:
    - import_role:
        name: bootstrapping
        tasks_from: create-partitions
    - import_role:
        name: bootstrapping
        tasks_from: luks-format-and-open
      tags: [rebuild-boot-parition, mount-partitions]
    - import_role:
        name: bootstrapping
        tasks_from: setup-lvm
    - import_role:
        name: bootstrapping
        tasks_from: create-partition-filesystems
    - import_role:
        name: bootstrapping
        tasks_from: mount-partitions
      tags: [rebuild-boot-parition, mount-partitions]
    - import_role:
        name: bootstrapping
        tasks_from: pacstrap
